name: Build corrected ebooks
run-name: Build corrected ebooks · ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - 'book-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '可选：填写已有 book-v* 标签，重建该标签的源码并补发四个独立 Release 文件；留空只构建'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ebooks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.deleted == false
    outputs:
      release_tag: ${{ steps.source.outputs.release_tag }}
      source_sha: ${{ steps.checkout.outputs.commit }}
      artifact_id: ${{ steps.ebooks.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Select the exact source ref and publication target
        id: source
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag=''
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF_TYPE" == 'tag' ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="$REQUESTED_TAG"
          fi
          source_ref="$GITHUB_SHA"
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^book-v[0-9][0-9A-Za-z._-]*$ ]] || { echo 'Invalid ebook version tag'; exit 1; }
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
              source_ref="refs/tags/$tag"
            fi
          fi
          printf 'release_tag=%s\nsource_ref=%s\n' "$tag" "$source_ref" >> "$GITHUB_OUTPUT"

      - name: Check out the exact book source (existing tag or selected commit)
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: book_reader/requirements-build.txt

      - name: Validate portable repository paths
        run: |
          python book_reader/scripts/validate_paths.py
          python -m unittest discover -s book_reader/tests -p test_path_policy.py -v

      - name: Install pinned build dependencies
        run: |
          python -m pip install --disable-pip-version-check -r book_reader/requirements-build.txt
          python -m pip check

      - name: Prepare verified Simplified and Traditional Chinese fonts
        env:
          FONT_DIR: ${{ runner.temp }}/gobi-fonts
        run: |
          mkdir -p "$FONT_DIR"
          # Pin upstream sources and verify all bytes before fontTools parses them.
          base='https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c'
          for family in Sans Serif; do
            for script in sc tc; do
              suffix="${script^^}"
              curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
                "$base/$family/Variable/TTF/Noto${family}CJK${script}-VF.ttf" \
                -o "$FONT_DIR/Noto${family}${suffix}-VF.ttf"
            done
          done
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            'https://github.com/lxgw/LxgwWenKai/releases/download/v1.522/LXGWWenKai-Light.ttf' \
            -o "$FONT_DIR/LXGWWenKai-Light.ttf"
          (
            cd "$FONT_DIR"
            printf '%s\n' \
              '990c807e79c25662a5a9ecf7f971baeb2bf2eab9a559e5ecf15cdfdb8561d21f  NotoSansSC-VF.ttf' \
              '6b40dd16cf1b73b5a7a0ed2472d641b60e3e85e87211abd20009f67d841425da  NotoSansTC-VF.ttf' \
              'dbf8ac0523dc19fa6294c52ce127a81c1b5b43ddc2e0915942bfd50aa58f4c53  NotoSerifSC-VF.ttf' \
              '9e63b78b1ece809121ff29eb880c55e196294ded9d54c0ec4ece9e4fb4daf728  NotoSerifTC-VF.ttf' \
              '526ec70cbb0118e871d481f8179e03ff045f0e4d72d080dcca87950c4ab27cca  LXGWWenKai-Light.ttf' \
              | sha256sum --check --strict
          )
          # ReportLab requires static TrueType outlines; retain true 300 Light WenKai.
          for family in Sans Serif; do
            for suffix in SC TC; do
              fonttools varLib.instancer "$FONT_DIR/Noto${family}${suffix}-VF.ttf" wght=400 \
                --output "$FONT_DIR/Noto${family}${suffix}-Regular.ttf"
            done
          done

      - name: Rebuild from reviewed manuscripts and validate all four ebooks
        env:
          GOBI_FONT_SC: ${{ runner.temp }}/gobi-fonts/NotoSansSC-Regular.ttf
          GOBI_FONT_TC: ${{ runner.temp }}/gobi-fonts/NotoSansTC-Regular.ttf
        run: |
          # No OCR, regional vocabulary reconversion, or old root ebook inputs.
          python book_reader/scripts/validate_proofreading.py
          python book_reader/scripts/build_continuous_transcript.py
          python book_reader/scripts/validate_manuscript.py
          python book_reader/scripts/build_epub.py
          python book_reader/scripts/build_pdf.py
          python book_reader/scripts/build_reader_site.py
          python book_reader/scripts/validate_manuscript.py --exports
          python -m unittest discover -s book_reader/tests -v
          python book_reader/scripts/validate_proofreading.py
          git diff --exit-code -- book_reader/text book_reader/images book_reader/ocr book_reader/qa

      - name: Check deliverables and write SHA-256 checksums
        run: |
          cd book_reader/output
          files=('走出戈壁-简体.epub' '走出戈壁-简体.pdf' '走出戈壁-繁体.epub' '走出戈壁-繁体.pdf')
          for file in "${files[@]}"; do
            test -s "$file"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          ls -lh "${files[@]}"

      - name: Upload the four ebooks and checksums
        id: ebooks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gobi-ebooks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            book_reader/output/走出戈壁-简体.epub
            book_reader/output/走出戈壁-简体.pdf
            book_reader/output/走出戈壁-繁体.epub
            book_reader/output/走出戈壁-繁体.pdf
            book_reader/output/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Add download link to the run summary
        env:
          ARTIFACT_URL: ${{ steps.ebooks.outputs.artifact-url }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          {
            printf '## 四份校订电子书已构建并通过校验\n\n'
            printf '来源：`%s`，提交：`%s`。\n\n' "$SOURCE_REF" "$SOURCE_SHA"
            printf '[下载四份电子书与 SHA-256 校验文件](%s)\n\n' "$ARTIFACT_URL"
            printf '包含简体 EPUB/PDF、繁体 EPUB/PDF。产物保留 90 天（以仓库策略为限），请及时保存。\n'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: ebook-release-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      # Use the publisher from this workflow's commit, not from an old book tag.
      # Book-building code runs only in the read-only build job above.
      - name: Check out the publication helper from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Download this build's verified ebooks
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/gobi-release

      - name: Test safe publication behavior
        run: python -m unittest discover -s book_reader/tests -p 'test_publish_release.py' -v

      - name: Publish four separate assets to the existing tag's Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          RELEASE_DIR: ${{ runner.temp }}/gobi-release
        run: >-
          python book_reader/scripts/publish_release.py
          --tag "$RELEASE_TAG"
          --source-sha "$SOURCE_SHA"
          --directory "$RELEASE_DIR"
