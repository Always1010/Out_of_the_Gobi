<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>走出戈壁 · 前20页知识图谱</title>
  <style>
    :root{--bg:#f3f0e8;--paper:#fffdf8;--ink:#252a27;--muted:#66716b;--line:#d8d7ce;--teal:#006a68;--gold:#b67722;--blue:#4c65a1;--red:#a44d47;--shadow:0 10px 30px #18251a12}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
    a{color:var(--teal)}button,input,select{font:inherit}button{cursor:pointer}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 30px;background:#193c39;color:white}
    header .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#b9d5c6}h1{font-family:Georgia,"Noto Serif CJK SC",serif;font-weight:600;font-size:27px;letter-spacing:.03em;margin:3px 0 0}
    header p{margin:0;color:#d4e5dc;max-width:680px;font-size:13px}
    .app{display:grid;grid-template-columns:290px minmax(400px,1fr) 350px;min-height:calc(100vh - 96px)}
    aside,.detail{background:var(--paper);overflow:auto;max-height:calc(100vh - 96px)}aside{border-right:1px solid var(--line);padding:22px 18px}.detail{border-left:1px solid var(--line);padding:24px 22px}
    .section-title{font-weight:700;font-size:13px;letter-spacing:.07em;color:#49645b;text-transform:uppercase;margin:24px 0 10px}.section-title:first-child{margin-top:0}
    .search{width:100%;border:1px solid #bbc9bf;border-radius:9px;padding:10px 12px;background:#fff}.seg{display:flex;background:#e9eee9;padding:3px;border-radius:10px;gap:3px}.seg button{flex:1;border:0;background:transparent;border-radius:8px 3px;color:#49645b;font-size:12px;white-space:nowrap}.seg button.active{background:white;color:var(--teal);box-shadow:0 1px 5px #1027181a;font-weight:700}
    .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;color:#5f6b64;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.stats{font-size:12px;color:#68756e;margin-top:9px}
    .timeline{display:flex;flex-direction:column;gap:5px}.tl{width:100%;text-align:left;border:1px solid transparent;border-radius:9px;background:transparent;padding:8px 9px}.tl:hover,.tl.active{background:#eaf2ec;border-color:#bdd0c2}.tl small{display:block;color:#708079;font-size:11px}.tl span{font-weight:600;font-size:13px}.timeline-empty{color:#87958c;font-size:13px}
    .canvas-wrap{position:relative;min-height:630px;background:radial-gradient(#d9e5dc 1px,transparent 1px) 0 0/24px 24px;overflow:hidden}.toolbar{position:absolute;z-index:2;top:16px;left:16px;display:flex;gap:7px;align-items:center}.toolbar button{border:1px solid #cbd8ce;background:#fff;border-radius:8px;padding:7px 10px;box-shadow:var(--shadow)}.hint{position:absolute;left:18px;bottom:14px;background:#fffdf8e8;padding:6px 9px;border-radius:7px;color:#64736a;font-size:11px;z-index:2}
    svg{width:100%;height:calc(100vh - 96px);min-height:630px;display:block;touch-action:none}.link{stroke:#9eb4a8;stroke-width:1.35;opacity:.68;vector-effect:non-scaling-stroke}.link.active{stroke:#c28b39;stroke-width:2.7;opacity:1}.node circle{stroke:white;stroke-width:2.2;filter:drop-shadow(0 3px 4px #16271c26);vector-effect:non-scaling-stroke}.node text{fill:#26332d;paint-order:stroke;stroke:#f7faf6;stroke-width:3.5;stroke-linejoin:round;pointer-events:none}.node{cursor:pointer}.node.dim{opacity:.18}.node.active circle{stroke:#d69733;stroke-width:4}.node:hover circle{stroke:#ffc66c;stroke-width:4}
    .kind-人物{fill:#006a68}.kind-事件{fill:#b67722}.kind-时间{fill:#4c65a1}.kind-地点{fill:#a44d47}.dot.kind-人物{background:#006a68}.dot.kind-事件{background:#b67722}.dot.kind-时间{background:#4c65a1}.dot.kind-地点{background:#a44d47}
    .detail h2{font:600 25px Georgia,"Noto Serif CJK SC",serif;margin:8px 0}.pill{display:inline-block;padding:3px 8px;background:#e7efe8;color:#426d56;border-radius:20px;font-size:11px;font-weight:700}.detail .summary{color:#4c5a51;margin:12px 0 22px}.evidence{border-top:1px solid var(--line);padding:14px 0}.evidence:first-of-type{border-top:0}.relation{font-weight:700;color:#405449}.quote{background:#f1f2eb;border-left:3px solid #a5b9a8;padding:9px 11px;margin:8px 0;font-family:Georgia,"Noto Serif CJK SC",serif;font-size:13px}.source{font-size:12px;color:#637068}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:7px;font-size:12px}.preview{width:100%;max-height:440px;object-fit:contain;background:#f4f3ef;border:1px solid var(--line);border-radius:8px;margin-top:12px}.notice{background:#edf3ee;border:1px solid #ceded1;border-radius:10px;padding:11px;font-size:12px;color:#486050;margin-top:14px}.muted{color:#829088}.page-list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.page-list button{border:1px solid #d2ded4;background:#fff;border-radius:7px;padding:7px}.page-list button:hover{border-color:var(--teal);color:var(--teal)}
    @media(max-width:1100px){.app{grid-template-columns:240px 1fr}.detail{grid-column:1/-1;max-height:none;border-top:1px solid var(--line)}aside{max-height:calc(100vh - 96px)}svg{height:calc(100vh - 96px)}}
    @media(max-width:700px){header{display:block;padding:17px}h1{font-size:23px}header p{margin-top:8px}.app{display:block}aside,.detail{max-height:none}.canvas-wrap,svg{height:540px;min-height:540px}}
  </style>
</head>
<body>
<header><div><div class="eyebrow">Gobi · pilot / 01—20</div><h1>《走出戈壁》知识图谱</h1></div><p>人物、事件、时间、地点及可回溯的关系。依据扫描 PDF 前 20 个物理页；单击节点查看书页证据，拖动平移，滚轮缩放。</p></header>
<div class="app">
  <aside>
    <div class="section-title">探索范围</div><div class="seg" id="topic"><button data-topic="人生" class="active">作者人生</button><button data-topic="歷史背景">历史背景</button><button data-topic="全部">全部</button></div>
    <div class="section-title">查找节点</div><input class="search" id="search" placeholder="输入人物、事件、地点…" aria-label="查找节点"><div class="stats" id="stats"></div>
    <div class="section-title">图例</div><div class="legend"><div><i class="dot kind-人物"></i>人物</div><div><i class="dot kind-事件"></i>事件</div><div><i class="dot kind-时间"></i>时间</div><div><i class="dot kind-地点"></i>地点</div></div>
    <div class="section-title">时间线</div><div class="timeline" id="timeline"></div>
    <div class="section-title">扫描页</div><div class="page-list" id="pages"></div>
  </aside>
  <main class="canvas-wrap"><div class="toolbar"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">－</button><button id="reset">重置视图</button></div><svg id="graph" role="img" aria-label="走出戈壁前20页知识图谱"><g id="viewport"><g id="links"></g><g id="nodes"></g></g></svg><div class="hint">点击节点查看证据 · 拖动节点或画布 · 滚轮缩放</div></main>
  <section class="detail" id="detail"><div class="pill">阅读提示</div><h2>从节点进入原书</h2><p class="summary">选择一个人物或事件，右侧将显示关系、原书短引文和 PDF 物理页码。前 20 页主要由封面、序、作者简介和开篇历史背景组成。</p><div class="notice">图中的历史叙述先标为“书中叙述”。仁川登陆的日期、地点和指挥官另有美国国家档案馆资料交叉核对。试点尚未覆盖第一章后续内容。</div></section>
</div>
<script id="graph-data" type="application/json">__GRAPH_JSON__</script>
<script>
(()=>{
  const G=JSON.parse(document.getElementById('graph-data').textContent), byId=new Map(G.nodes.map(n=>[n.id,n]));
  const svg=document.getElementById('graph'), view=document.getElementById('viewport'), linksLayer=document.getElementById('links'), nodesLayer=document.getElementById('nodes');
  const color={'人物':'#006a68','事件':'#b67722','时间':'#4c65a1','地点':'#a44d47'};
  let topic='人生', query='', active=null, scale=1, tx=0, ty=0, visibleNodes=[], visibleEdges=[], drag=null;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pageLink=p=>'../../走出戈壁-单伟健.pdf#page='+p;
  const pageImage=p=>'../tmp/page-'+String(p).padStart(3,'0')+'.png';
  function applyView(){view.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);const [w]=dimensions();[...nodesLayer.children].forEach(g=>{const n=byId.get(g.dataset.id),c=g.querySelector('circle'),t=g.querySelector('text'),left=n.x>w/2;c.setAttribute('r',(Number(c.dataset.baseR)||7)/scale);t.setAttribute('font-size',11/scale);t.setAttribute('stroke-width',3.5/scale);t.setAttribute('x',(left?-11:11)/scale);t.setAttribute('y',4/scale);t.setAttribute('text-anchor',left?'end':'start')})}
  function dimensions(){const r=svg.getBoundingClientRect();return [r.width||900,r.height||700]}
  function filtered(){
    const events=G.nodes.filter(n=>n.kind==='事件'&&(topic==='全部'||n.topic===topic));
    const eventIds=new Set(events.map(n=>n.id)), set=new Set(eventIds);
    const selectedEdges=G.edges.filter(e=>eventIds.has(e.source)||eventIds.has(e.target));
    selectedEdges.forEach(e=>{set.add(e.source);set.add(e.target)});
    const personalEdges=topic==='歷史背景'?[]:G.edges.filter(e=>byId.get(e.source).kind!=='事件'&&byId.get(e.target).kind!=='事件'&&(set.has(e.source)||set.has(e.target)));
    personalEdges.forEach(e=>{set.add(e.source);set.add(e.target)});
    visibleNodes=G.nodes.filter(n=>set.has(n.id));visibleEdges=[...selectedEdges,...personalEdges];
    document.getElementById('stats').textContent=`${visibleNodes.length} 个节点 · ${visibleEdges.length} 条关系`;
  }
  function layout(){
    const [w,h]=dimensions(), cx=w/2,cy=h/2, r=Math.min(w,h)*.28;
    visibleNodes.forEach((n,i)=>{const a=i*2.39996323; n.x=cx+Math.cos(a)*r*Math.sqrt((i+1)/visibleNodes.length);n.y=cy+Math.sin(a)*r*Math.sqrt((i+1)/visibleNodes.length);n.vx=0;n.vy=0});
    const n=visibleNodes.length, desired=n>50?95:85, repulsion=n>50?1400:850;
    for(let step=0;step<250;step++){
      for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){let a=visibleNodes[i],b=visibleNodes[j],dx=a.x-b.x,dy=a.y-b.y,d2=Math.max(100,dx*dx+dy*dy),f=repulsion/d2; a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
      for(const e of visibleEdges){let a=byId.get(e.source),b=byId.get(e.target),dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),f=(d-desired)*.035; a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
      visibleNodes.forEach(v=>{v.vx+=(cx-v.x)*.012;v.vy+=(cy-v.y)*.012;v.vx*=.62;v.vy*=.62;v.x+=Math.max(-8,Math.min(8,v.vx));v.y+=Math.max(-8,Math.min(8,v.vy))});
    }
  }
  function renderGraph(){
    filtered();layout();linksLayer.innerHTML='';nodesLayer.innerHTML='';
    const ns='http://www.w3.org/2000/svg';
    for(const e of visibleEdges){const line=document.createElementNS(ns,'line');line.setAttribute('class','link');line.dataset.from=e.source;line.dataset.to=e.target;linksLayer.appendChild(line)}
    for(const n of visibleNodes){const g=document.createElementNS(ns,'g');g.setAttribute('class','node');g.dataset.id=n.id;const c=document.createElementNS(ns,'circle');c.setAttribute('class','kind-'+n.kind);c.dataset.baseR=n.kind==='事件'?8:n.id==='shan'?13:7;g.appendChild(c);const title=document.createElementNS(ns,'title');title.textContent=n.kind+'：'+n.label;g.appendChild(title);const t=document.createElementNS(ns,'text');t.textContent=n.label;g.appendChild(t);nodesLayer.appendChild(g);g.addEventListener('click',ev=>{ev.stopPropagation();select(n.id)});g.addEventListener('pointerdown',ev=>{ev.stopPropagation();drag={node:n,startX:ev.clientX,startY:ev.clientY};g.setPointerCapture(ev.pointerId)})}
    updatePositions();fitView();renderTimeline();highlight();
  }
  function fitView(){const [w,h]=dimensions(),xs=visibleNodes.map(n=>n.x),ys=visibleNodes.map(n=>n.y);if(!xs.length)return;const minx=Math.min(...xs)-55,maxx=Math.max(...xs)+125,miny=Math.min(...ys)-35,maxy=Math.max(...ys)+35;scale=Math.min(1.25,(w-28)/(maxx-minx),(h-28)/(maxy-miny));tx=w/2-scale*(minx+maxx)/2;ty=h/2-scale*(miny+maxy)/2;applyView()}
  function updatePositions(){[...linksLayer.children].forEach(l=>{let a=byId.get(l.dataset.from),b=byId.get(l.dataset.to);l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y)});[...nodesLayer.children].forEach(g=>{const n=byId.get(g.dataset.id);g.setAttribute('transform',`translate(${n.x},${n.y})`)})}
  function renderTimeline(){const box=document.getElementById('timeline');box.innerHTML='';const events=visibleNodes.filter(n=>n.kind==='事件').sort((a,b)=>a.date.localeCompare(b.date));for(const n of events){const b=document.createElement('button');b.className='tl'+(n.id===active?' active':'');b.innerHTML=`<small>${esc(n.date)} · PDF ${n.page}</small><span>${esc(n.label)}</span>`;b.onclick=()=>select(n.id);box.appendChild(b)}if(!events.length)box.innerHTML='<div class="timeline-empty">当前范围无事件</div>'}
  function highlight(){const adjacent=new Set(active?[active]:[]);if(active)visibleEdges.forEach(e=>{if(e.source===active)adjacent.add(e.target);if(e.target===active)adjacent.add(e.source)});const q=query.trim().toLowerCase();[...nodesLayer.children].forEach(g=>{const n=byId.get(g.dataset.id), match=!q||n.label.toLowerCase().includes(q);g.classList.toggle('dim',!match&&(!active||!adjacent.has(n.id)));g.classList.toggle('active',n.id===active)});[...linksLayer.children].forEach(l=>l.classList.toggle('active',!!active&&(l.dataset.from===active||l.dataset.to===active)))}
  function select(id){active=id;const n=byId.get(id), all=visibleEdges.filter(e=>e.source===id||e.target===id);let html=`<div class="pill">${esc(n.kind)}${n.topic?' · '+esc(n.topic):''}</div><h2>${esc(n.label)}</h2><p class="summary">${esc(n.detail||'')}${n.date?' · '+esc(n.date):''}</p>`;
    if(n.kind==='事件'&&n.page)html+=`<div class="links"><a href="${pageLink(n.page)}" target="_blank" rel="noopener">打开 PDF 第 ${n.page} 页 ↗</a><a href="${pageImage(n.page)}" target="_blank" rel="noopener">查看扫描页 ↗</a></div>`;
    html+=`<div class="section-title">关系与原书证据 · ${all.length}</div>`;
    for(const e of all){const other=byId.get(e.source===id?e.target:e.source),ev=e.evidence;html+=`<div class="evidence"><div class="relation">${esc(e.label)} → <a href="#" data-select="${esc(other.id)}">${esc(other.label)}</a></div><div class="quote">“${esc(ev.quote)}”</div><div class="source">${esc(ev.section)} · PDF 物理页 ${ev.pdf_page}</div><div class="links"><a href="${pageLink(ev.pdf_page)}" target="_blank" rel="noopener">原书 PDF ↗</a><a href="${pageImage(ev.pdf_page)}" target="_blank" rel="noopener">扫描页 ↗</a>${ev.external?`<a href="${esc(ev.external)}" target="_blank" rel="noopener">外部核对资料 ↗</a>`:''}</div></div>`}
    if(n.kind==='事件'&&n.page)html+=`<img class="preview" src="${pageImage(n.page)}" alt="PDF 第 ${n.page} 页扫描图" loading="lazy">`;
    document.getElementById('detail').innerHTML=html;document.getElementById('detail').querySelectorAll('[data-select]').forEach(a=>a.onclick=ev=>{ev.preventDefault();select(a.dataset.select)});renderTimeline();highlight();
  }
  document.getElementById('topic').onclick=e=>{if(!e.target.dataset.topic)return;topic=e.target.dataset.topic;document.querySelectorAll('#topic button').forEach(b=>b.classList.toggle('active',b.dataset.topic===topic));active=null;renderGraph();select(topic==='歷史背景'?'e_incheon':'shan')};
  document.getElementById('search').oninput=e=>{query=e.target.value;highlight();const first=visibleNodes.find(n=>n.label.toLowerCase().includes(query.trim().toLowerCase()));if(query.trim()&&first)select(first.id)};
  function zoom(f,x,y){const [w,h]=dimensions();x??=w/2;y??=h/2;const next=Math.max(.35,Math.min(3.5,scale*f));tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;applyView()}
  document.getElementById('zoomIn').onclick=()=>zoom(1.2);document.getElementById('zoomOut').onclick=()=>zoom(1/1.2);document.getElementById('reset').onclick=()=>{scale=1;tx=0;ty=0;applyView()};
  svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={pan:true,x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId)});
  svg.addEventListener('pointermove',e=>{if(!drag)return;if(drag.pan){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;applyView()}else{drag.node.x+=(e.clientX-drag.startX)/scale;drag.node.y+=(e.clientY-drag.startY)/scale;drag.startX=e.clientX;drag.startY=e.clientY;updatePositions()}});
  svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
  document.getElementById('pages').innerHTML=Array.from({length:20},(_,i)=>`<button data-page="${i+1}">${i+1}</button>`).join('');document.getElementById('pages').onclick=e=>{const p=Number(e.target.dataset.page);if(!p)return;document.getElementById('detail').innerHTML=`<div class="pill">扫描页</div><h2>PDF 第 ${p} 页</h2><p class="summary">页码指 PDF 物理页，与书中印刷页码可能不同。</p><div class="links"><a href="${pageLink(p)}" target="_blank" rel="noopener">打开原 PDF ↗</a></div><img class="preview" src="${pageImage(p)}" alt="PDF 第 ${p} 页扫描图">`};
  renderGraph();select('e_birth');
})();
</script>
</body>
</html>
