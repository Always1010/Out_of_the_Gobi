<script id="story-data" type="application/json">{"title":"走出戈壁","subtitle":"单伟建的人生地图","scope":"以原书为主：正文至1993年，后记回到2005年。","overview":{"title":"一条走出去，\n又走回来的路","intro":"从北京的失学少年，到戈壁的劳动者，再到太平洋彼岸的学生与教师。地点在改变，求知、相助与选择的代价，一直贯穿单伟建的人生。2005年，他重返曾经急于离开的土地。","route":["beijing","wulate","beijing","sanfrancisco","berkeley","washington","philadelphia","hongkong","wuliang"],"stops":["beijing","wulate","sanfrancisco","philadelphia","hongkong"]},"stages":[{"id":"childhood","number":"一","title":"被打断的童年","date":"1953—1969","place":"山东 · 北京","map":"china","deck":"学校消失以后，读书的愿望还在。","intro":"1953年10月，单伟建出生在山东，童年在北京度过。饥荒中的父母尽力让孩子吃饱，学校和科技馆给了他阅读、动手的快乐。1966年，小学毕业后的升学考试取消。他从此失学，却仍从焚书的火边把书捡回家。","question":"一个原本准备升学的孩子，怎样面对突然中断的生活？","reflection":"这一幕留下两样贯穿全书的东西：家人的具体照料，以及对知识的好奇。后来它们都要跨越很远的距离。","photo":33,"photo_caption":"童年的作者与家人。原书照片页记有1957年、1959年和1962年的合影。","stops":["shandong","beijing"],"route":["shandong","beijing"],"scenes":["early-family-hunger","early-radio-workshop","early-books-from-fire","early-village-question"]},{"id":"survival","number":"二","title":"在戈壁活下去","date":"1969—1971","place":"乌拉特前旗 · 乌梁素海","map":"china","deck":"饥饿、寒冷与劳动，把远方变成了日常。","intro":"1969年9月，十五岁的他乘车离开北京。兵团宣传中的边疆，变成了草棚、土豆地、防空洞和冰封的湖面。他学会使用铁锹，也学会与同伴分工。但能吃苦并不保证劳动有成果，朋友分来的半个窝头有时比口号更实在。","question":"当生活几乎被生存占满，一个人靠什么熬过每一天？","reflection":"提高打苇效率与挖出废弃水渠，是同一时期的两种经验。它们让“努力是否有用”成为可以亲身感受到的问题。","photo":163,"photo_caption":"在乌梁素海冰面打芦苇。刘小彤摄，原书PDF第163页。照片用于呈现劳动环境，不对应每个场景的确切日期。","stops":["beijing","wulate","wuliang"],"route":["beijing","wulate","wuliang"],"scenes":["early-beijing-to-gobi","early-potatoes-letter-home","early-reed-division-of-labor","gobi-canal-31-hours","gobi-winter-borrowed-warmth"]},{"id":"possibility","number":"三","title":"把出路学出来","date":"1971—1975","place":"五连 · 坝头 · 乌拉特前旗","map":"china","deck":"在不能离开的地方，保存离开的能力。","intro":"医书把他带进短暂的卫生员训练，猪班里的易空让他看见更大的世界。被批判后，他一面藏在工具棚夜读，一面学习与人相处。多年积累终于遇到大学招生，却还要穿过投票、审批、体检和面试。一张车票的背后，既有他的准备，也有别人的援手与偶然。","question":"能力已经积累，机会为什么仍可能被挡在门外？","reflection":"1975年的离开有一连串具体条件：战友的支持、于医生的帮助、招生老师的认可与最后的批准。把它们放在一起，才能理解这次转折的分量。","photo":246,"photo_caption":"作者与被下放养猪的航空专家易空（右）。刘小彤摄，原书PDF第246页上图。","stops":["wulate","wuliang","beijing"],"route":["wuliang","wulate","beijing"],"scenes":["gobi-barefoot-training","gobi-child-in-clinic","gobi-brick-machine","gobi-yi-kong","gobi-reading-and-making-friends","gobi-letter-on-horseback","gobi-1974-rejected","gobi-1975-alternate","gobi-exam-ready","gobi-leaving-same-day"]},{"id":"classroom","number":"四","title":"重新成为学生","date":"1975—1980","place":"北京","map":"china","deck":"离开戈壁之后，仍要一点点补回失去的教育。","intro":"1975年秋，他回到北京对外贸易学院，从英语发音重新学起。电灯、热水和足够的饭菜带来安稳，重返兵团的噩梦却多年不散。课堂之外，他与石滨相识、结婚。新的赴美机会出现时，他在待遇与学习之间选择了后者，也接受了暂时与妻子分离。","question":"终于回到课堂以后，他最想补回什么？","reflection":"正规教育的中断没有在收到录取通知时自动结束。语言、基础、学位和安全感，都需要重新建立。","photo":318,"photo_caption":"作者与石滨1978年在长城的合影，以及结婚照。原书PDF第318页。","stops":["beijing"],"route":[],"scenes":["return-to-beijing","tiananmen-1976","marry-shibin","choose-study-over-un"]},{"id":"pacific","number":"五","title":"跨过太平洋","date":"1980—1986","place":"旧金山 · 伯克利","map":"pacific","deck":"学习的路变宽了，门槛也换了模样。","intro":"第一次赴美，他想要一个正式学位，却发现访问学者的身份与学费都成了障碍。教授、捐助人和朋友帮助他完成硕士。再到伯克利读博士时，失去中学教育留下的数学缺口重新显现；他反复补课，也逐渐成为老师。另一条同样重要的路，是石滨带着儿子奔向团聚的路。","question":"远行需要个人努力，也需要哪些人让道路真正可走？","reflection":"求学和家庭不是两段互不相干的经历。奖学金、签证、照护与相聚的时间，共同决定他能够怎样学习。","photo":9,"photo_caption":"作者与博士导师珍妮特·耶伦。照片见原书前言，拍摄日期未标明。","stops":["beijing","sanfrancisco","berkeley"],"route":["beijing","sanfrancisco","berkeley"],"scenes":["usf-degree-obstacle","anonymous-donor-mba","berkeley-math","family-reunion","teacher-researcher"]},{"id":"choices","number":"六","title":"开始自己选择","date":"1987—1993","place":"华盛顿 · 费城 · 香港","map":"pacific","deck":"从等待一个名额，到在几条道路之间作决定。","intro":"1986年12月完成博士后，一家三口乘火车横穿美国。短暂在世界银行工作后，他在沃顿和MIT的聘书之间选择了沃顿。教学带来研究自由，也有签证危机和生活压力。任教六年后，他决定进入商业实践，1993年举家迁往香港。原书正文在这次新的出发处结束。","question":"当机会终于增多，作选择又意味着放下什么？","reflection":"可选择并不等于没有约束。家庭、身份手续、工作兴趣和对中国改革的判断，仍然一起进入他的决定。","photo":394,"photo_caption":"1990年在沃顿教学、办公室与柏林之行的原书照片页。PDF第394页。","stops":["berkeley","washington","philadelphia","hongkong"],"route":["berkeley","washington","philadelphia","hongkong"],"scenes":["phd-world-bank","wharton-choice","visa-crisis","return-to-asia"]},{"id":"return","number":"七","title":"再回戈壁","date":"2005","place":"乌梁素海 · 五连旧址","map":"china","deck":"走得再远，仍要回头看留在原地的人。","intro":"2005年7月，他从香港经北京、包头重返阔别三十年的戈壁。旧营房消失了，田地重新长出芦苇。有些战友仍在这里生活，他与二狗重走当年打苇的驻地。书的最后留下故人和废墟，让此前的远行多了一层沉重的回声。","question":"自己的出路，与同代人的失落，应当怎样放在一起理解？","reflection":"原书将最后的目光留给这块土地对一代人的影响。这里既是他已经离开的地方，也是无法从人生中抹去的地方。","photo":414,"photo_caption":"2005年7月10日，作者在乌梁素海旁重遇昔日战友二狗；下图为返乡时所见。PDF第414页。","stops":["hongkong","beijing","baotou","wulate","wuliang"],"route":["hongkong","beijing","baotou","wulate","wuliang"],"scenes":["return-old-neighbours","return-reed-ruins"]}],"events":[{"id":"early-family-hunger","title":"母亲最后才吃饭","date_label":"约1960—1962年，饥荒时期","place":"北京台基厂头条，外贸部与海关宿舍大院","summary":"家里缺粮，母亲总等全家吃完才吃剩饭，腿上出现按下后久久不平的浮肿。年幼的单伟建还不懂原因，和孩子们采野菜、捡榆钱带回家，也给父亲养的兔子拔草。父母尽量保住孩子的口粮；成年回望，他才读懂这些日常照料里藏着的饥饿。","stakes":"家庭食物短缺，母亲因营养不良浮肿；孩子并未充分理解处境。","action":"采野菜、捡榆钱、拔草喂兔；这些是儿童参与家庭求生的具体动作。","change":"多年以后，孩子眼中平常的家务，成为他理解父母忍饥与保护的证据。","people":[{"name":"母亲（本章未具名）","role":"把较好的食物留给家人，自己吃剩余口粮。"},{"name":"父亲（本章未具名）","role":"养兔、宰兔供家人吃，自己不吃所杀的兔肉。"}],"chapter_id":"chapter-01","pdf_pages":[26,27,28,29],"quote":{"text":"然而，她一直在默默忍受着饥饿，从未发过牢騒。","pdf_page":27},"stage":"childhood","tags":["care"],"notes":[],"map_place":"beijing","person_ids":["parents"]},{"id":"early-radio-workshop","title":"听见自己焊出的收音机","date_label":"小学四、五年级，确切年份未注明","place":"北京北海公园，少年科技馆无线通信小组","summary":"读科普书和凡尔纳小说让他着迷，学校又推荐他进入少年科技馆。他每周到北海学习无线通信，从矿石收音机做起，再动手焊接二极管、三极管与电阻。最复杂的六管收音机还须朋友帮忙，但听见自己装出的机器发声，给了他很大的满足。","stakes":"对科学充满好奇，但制作复杂收音机超出自己当时的能力。","action":"参加每周活动，学习电路与焊接，向朋友求助。","change":"书里的好奇获得了动手实践的机会。学习在他这里，很早就包含自己试一试。","people":[{"name":"科技馆教师与朋友（未具名）","role":"提供动手学习环境，并帮助完成较复杂的收音机。"}],"chapter_id":"chapter-02","pdf_pages":[42,43,44],"quote":{"text":"自己制作的收音机给我极大的成就感和满足感。","pdf_page":44},"stage":"childhood","tags":["learning"],"notes":[],"map_place":"beijing","person_ids":[]},{"id":"early-books-from-fire","title":"考试取消以后，从火边捡书","date_label":"1966年，升学考试取消后","place":"北京外贸部干部子弟小学／台基厂宿舍大院","summary":"小学毕业后，他认真准备考进一流中学，却等来升学考试取消和入学无限延期。大院随即焚书，许多家庭为避祸把藏书丢进火里。他趁人不注意捡书藏回家，接触到此前少读的外国小说；正式教育断了，阅读却在危险而偶然的缝隙中继续。","stakes":"升学途径被切断；被视为毒草的书可能给收藏者带来麻烦。","action":"从焚书篝火旁偷捡书，塞进怀里带回家藏起来。","change":"正规教育中断，阅读却沿着偶然的缝隙继续；这段失学后来仍会在大学课程里留下缺口。","people":[{"name":"父亲（未具名）","role":"平日阅读古书影响儿子，也在焚书压力下只保留少数难舍的书。"}],"chapter_id":"chapter-03","pdf_pages":[47,48,49,54,55],"quote":{"text":"我在篝火边趁人不注意捡了一些书，塞在怀里拿回家藏起来。","pdf_page":54},"stage":"childhood","tags":["learning","choice"],"notes":[],"map_place":"beijing","person_ids":["parents"]},{"id":"early-village-question","title":"第一次在田间听见不同的声音","date_label":"1968年，秋季复课前","place":"山东牟平，武宁公社留生院村","summary":"父母把无学可上的姐弟送到姥姥家。他同村民锄地、清洗洋参、运粪，学会推独轮车，也为亲戚挣些工分。一起挖沟的年轻亲戚直言，大家拼命干却吃不饱饭。他第一次听见对毛泽东的批评，震惊又无法反驳，因为乡村的贫困就在眼前。","stakes":"城市孩子第一次长时间接触农村劳动、缺粮和与熟悉宣传不同的评价。","action":"认真参加劳动，和村民交谈，并询问姐姐自己是否加重亲戚负担。","change":"亲眼看见的生活，让他开始辨别口号与经验之间的距离。","people":[{"name":"年轻远房亲戚（未具名）","role":"挖沟时坦言辛苦劳动却吃不饱。"},{"name":"姥姥、大姨与大姨夫（未具名）","role":"接纳姐弟，安排较好的食物；母亲带来的钱粮支持了这份招待。"},{"name":"姐姐（未具名）","role":"同行，向他解释母亲预先给了现金和粮票。"}],"chapter_id":"chapter-05","pdf_pages":[76,77,78,79],"quote":{"text":"我知道，与北京的生活相比，乡村生活更艰难，说吃不饱饭是实话。","pdf_page":79},"stage":"childhood","tags":["choice"],"notes":[],"map_place":"shandong","person_ids":[]},{"id":"early-beijing-to-gobi","title":"1969年9月，离开北京","date_label":"1969年9月5日离京，次日晚到乌拉特前旗","place":"北京火车站 → 乌拉特前旗 → 十九团五连乌拉特驻地","summary":"十五岁的单伟建带着父母准备的木箱登上赴内蒙古的列车。此前他既舍不得家，也向往独立；汽笛响起时，却忍不住和送行者一起哭。三十多小时火车、四小时黑夜卡车后，他住进荒漠草棚，才发现面包、鱼肉与新军装的许诺没有兑现。","stakes":"在全体下乡的政策下没有留城选择；母亲希望姐弟同行的请求未成，家庭分散。","action":"随分配离京，卸行李并寻找自己的木箱，适应集体草棚与劳动生活。","change":"一次政策下的集体迁移，把家、学校与未来都推到很远的地方。","people":[{"name":"父亲（未具名）","role":"送站，嘱咐照顾自己、与人相处、写信报平安，并叹息孩子无法上学。"},{"name":"母亲（未具名）","role":"准备被褥衣物和木箱，自己也将下放东北。"},{"name":"程榆林","role":"邻居伙伴，与他分到同一连和房间。"},{"name":"刘凤亮","role":"三排排长，接站、组织行军和劳动。"},{"name":"王连发","role":"班长，以热汤面欢迎新来者。"}],"chapter_id":"chapter-06","pdf_pages":[88,89,90,91,92,93,94,100],"quote":{"text":"此时我才意识到，我不但要离家远去，而且将很久很久见不到父母。","pdf_page":89},"stage":"survival","tags":["care","choice"],"notes":[],"map_place":"wulate","person_ids":["parents"]},{"id":"early-potatoes-letter-home","title":"冻坏的土豆与第一封求助信","date_label":"1969年10月1日起约两周","place":"乌拉特驻地外土豆地、大车店与返回营房的路上","summary":"长途步行挖土豆的第一夜，他睡在自己挖的地坑里，冻得发抖；后来全排用土豆换来大车店住宿。收成迟迟无人运走，大量土豆冻烂。回程时崔贤超劝他读书、设法离开，并坦言这里在糟蹋青春。当晚他给父母写长信，第一次把寻求出路具体提出来。","stakes":"劳动产出被浪费，饥饿、寒冷持续；看不见离开兵团的途径。","action":"挖土豆、过地坑夜、分拣腐烂收成；听取崔贤超建议后写信询问父母能否帮助离开。","change":"从给家里报喜，到具体地请求帮助，他开始承认自己想要离开的愿望。","people":[{"name":"李宝权","role":"途中分享稀缺饮水，以幽默和互助支持他。"},{"name":"刘凤亮","role":"带队，交涉用土豆支付住宿与换取火柴。"},{"name":"崔贤超","role":"直言兵团困境，鼓励继续读书和寻找机会。"},{"name":"大车店老板（未具名）","role":"提供住宿，以半盒火柴换走一麻袋土豆。"}],"chapter_id":"chapter-07","pdf_pages":[105,106,110,111,112,113,115,116,117],"quote":{"text":"第二天，我把信发出去了，心怀一线希望。","pdf_page":117},"stage":"survival","tags":["care","choice"],"notes":[],"map_place":"wulate","person_ids":["li-baoquan","cui-xianchao"]},{"id":"early-reed-division-of-labor","title":"冰上的三个人，重新分工","date_label":"到戈壁的第一个冬天，约1969年冬—1970年春节前","place":"乌梁素海冰面、芦苇窝棚","summary":"在零下二三十度的湖面，他与刘小彤起初各自铲苇、捆苇，累到极点仍难完成定额。两人改为分工，再发现捆得比铲得快，于是增加一人，形成两人铲、一人捆，终于能超额完成。效率提高没有消除饥寒；父亲寄来的苦巧克力，成了下午御寒的短暂帮助。","stakes":"冰面露宿、每天两餐且限量、长时间强体力劳动，每人日任务为一千斤芦苇。","action":"与伙伴观察工序耗时，先两人分工再增至三人轮换；写信请父亲寄苦巧克力。","change":"改变分工能提高效率，却无法解决寒冷、饥饿和缺少选择的生活。","people":[{"name":"刘小彤","role":"打苇搭档，一起尝试并改进分工作业。"},{"name":"第三位搭档（未具名）","role":"加入小组，使两人铲苇、一人打捆成为可能。"},{"name":"父亲（未具名）","role":"应请求寄来一小包苦巧克力。"}],"chapter_id":"chapter-10","pdf_pages":[145,146,147,148,150,151],"quote":{"text":"我们又找了一个人加入到我们这组，采取这种打法，很快，我们组就能超额完成每天的任务。","pdf_page":148},"stage":"survival","tags":["care"],"notes":[],"map_place":"wuliang","person_ids":["parents","liu-xiaotong"]},{"id":"gobi-canal-31-hours","title":"三十一小时，挖出一条不能通水的渠","date_label":"1971年5月9日起，连续三十一小时","place":"义和渠工地，距五连约十五至二十公里","summary":"不足一百斤的他与班长丁德生抬百公斤土筐，在盐碱风沙中连干三十一小时。饥寒最重时，两人分食半个窝头，夜里同伴靠歌声熬过长夜。完工约一周后，却得知地势太高、渠段废弃；曾令他自豪的耐力，变成对徒劳劳动的切身疑问。","stakes":"身体已经透支，命令却要求工程不完不得收兵。","action":"跟随丁德生挑土、共同分食，熬过通宵；5月12日写信向父母叙述。","change":"从证明自己能吃苦，转向意识到坚持与成果之间可能被瞎指挥切断。","people":[{"name":"丁德生（大圣）","role":"班长、抬土搭档，把省下的半个窝头分给他"},{"name":"刘小彤","role":"夜间独唱，为同伴表达饥寒与盼望"},{"name":"母亲","role":"保存家书，使当日记录得以留存"}],"chapter_id":"chapter-12","pdf_pages":[167,168,169,170,171,172,173,174,175,176,177,178,179],"quote":{"text":"大约一周后，我们听说义和渠的路线设计错了，我们修建的部分地势太高，水无法流过，不得不被放弃，需要另修一段渠道。","pdf_page":179},"stage":"survival","tags":["care","choice"],"notes":[],"map_place":"wulate","person_ids":["liu-xiaotong"]},{"id":"gobi-winter-borrowed-warmth","title":"一顶皮帽、一双大头鞋和母亲的手套","date_label":"1971年12月4日起的打苇季节","place":"五连 → 坝湾 → 乌梁素海南场","summary":"去南场打芦苇时，他把厚衣物装上运货卡车，途中风沙突起，耳脚冻僵。崔贤超让出皮帽，李荣田事先借给他大头鞋；后来母亲寄来的羊皮手套保护他的双手。水位降低、旧苇茬露出冰面，劳动更重，几样借来与寄来的衣物成为能否熬过去的关键。","stakes":"长途行军、极寒和更难铲除的芦苇同时消耗身体。","action":"接受朋友相助，和同伴分组完成定额，并坚持参加劳动。","change":"生存不只是个人能吃苦，也依靠朋友和远方家人的具体照料。","people":[{"name":"崔贤超","role":"途中把自己的皮帽让给他"},{"name":"李荣田","role":"借出唯一的大头鞋"},{"name":"母亲","role":"从吉林五七干校寄来羊皮手套"},{"name":"陈凤琴","role":"劳动组里出力极多的女知青"}],"chapter_id":"chapter-11","pdf_pages":[156,157,158,159,160,161,162],"quote":{"text":"我平时很能吃苦的，但今天被冻残了，没有朋友的帮助，真不知道怎么熬过来。","pdf_page":158},"stage":"survival","tags":["care"],"notes":[],"map_place":"wuliang","person_ids":["parents","li-rongtian","cui-xianchao"]},{"id":"gobi-barefoot-training","title":"一本医书换来五周课堂","date_label":"1971年6月3日获通知，次日出发","place":"五连营房 → 坝头团部医院","summary":"他正靠着营房看书，忽然被指导员叫去：于医生推荐他当卫生员。朋友一路替他扛行李送上卡车。他在坝头第一次接受医疗训练，原定三个月缩成五周；课程带来求知的兴奋，减少的口粮却使他饥饿失眠。偶然被看见的阅读习惯，第一次改变了他的工作。","stakes":"能否从重体力劳动中获得学习机会，取决于他人的推荐。","action":"去坝头学习诊断与护理，在课堂上用逻辑回答胃穿孔问题。","change":"从自读《赤脚医生手册》进入实际训练，并得到于医生认可。","people":[{"name":"于医生","role":"推荐他受训的军医，后来在体检关再次相助"},{"name":"张松森","role":"指导员，通知组织决定"},{"name":"李荣田","role":"提醒他感谢于医生的朋友"}],"chapter_id":"chapter-14","pdf_pages":[194,195,196,197,198,199,200,201,202],"quote":{"text":"按计划，赤脚医生学习班的课程是三个月，但不知为何团领导改变了主意，说培训不需要这么久，结果压缩到五个星期。","pdf_page":202},"stage":"possibility","tags":["learning","care"],"notes":[],"map_place":"wulate","person_ids":["doctor-yu"]},{"id":"gobi-child-in-clinic","title":"诊室里，一个孩子睁开了眼睛","date_label":"学医归来后的一天","place":"五连卫生室","summary":"一位母亲抱来持续高烧、开始抽搐的幼儿，因为没钱一直不敢求医。转院路途颠簸，孩子可能撑不住。他请来更有经验的高晓荣共同急救，整夜守着输液瓶；翌日见孩子睁眼拿着玩具，才放下心。两人免去费用，劳动之外终于出现一种看得见的满足。","stakes":"病童情况危急，当地农民缺乏就医条件，年轻卫生员也害怕救不回来。","action":"与高晓荣合作诊断、治疗、轮流通宵照护，并告知母亲不收费用。","change":"知识第一次直接对应一个获救的生命，使他感受到帮助他人的价值。","people":[{"name":"高晓荣","role":"更有经验的卫生员，合作抢救并轮班照护"},{"name":"未具名母亲与三岁男孩","role":"来自附近农村的求医者"}],"chapter_id":"chapter-15","pdf_pages":[208,209,210],"quote":{"text":"那个妇女千恩万谢，我们更高兴，治病救人给我带来强烈的满足感。","pdf_page":210},"editorial_note":"作为历史医疗经历呈现，不把具体用药、民间疗法或作者医学判断转化为治疗建议。","stage":"possibility","tags":["learning","care"],"notes":[],"map_place":"wulate","person_ids":["gao-xiaorong"]},{"id":"gobi-brick-machine","title":"从压面机想到制砖机","date_label":"1972年春至秋前","place":"五连砖坯场、砖窑 → 苏独伦十四团 → 五连营房","summary":"营建任务让他从种地转去脱坯，三人一天做到一千块仍累得睡不好。他从家乡压面机想到机械制砖，与铁匠李荣田画图、去十四团取经，看到机器一天能产两三万块；方案终无下文。他仍轮班烧窑、砌墙、接电，在烟尘中做出十二万块砖，也看到劳动可以有实用成果。","stakes":"繁重手工与暴雨毁坯反复吞没成果，机械方案需要钱和领导支持。","action":"提出机械化、说服李荣田、争取考察，并参与烧窑盖房和接电。","change":"获得工艺与工程经验，也开始用效率和领导方式比较不同组织的结果。","people":[{"name":"李荣田","role":"铁匠，绘制草图并同行考察"},{"name":"哈白、阎崇洁","role":"脱坯搭档"},{"name":"十四团制砖连领导","role":"热情分享机器经验，提供另一种管理方式的参照"}],"chapter_id":"chapter-16","pdf_pages":[217,218,219,220,221,222,223,224,225,226,228,229,230,231,232],"quote":{"text":"后来，我们催了几次，每次他都打哈哈，然后还是没有下文。显然，他不热心。","pdf_page":226},"stage":"possibility","tags":["learning"],"notes":[],"map_place":"wulate","person_ids":["li-rongtian"]},{"id":"gobi-yi-kong","title":"猪圈旁，听见另一个世界","date_label":"与易空相识后；1973年春送别","place":"五连猪班宿舍与猪食厨房；易空后返呼和浩特","summary":"从替易空看病、合力照料病猪开始，他常去猪班借安静读书。被下放的航空专家读他的书，也向他讲战争年代见到的美国，令他第一次怀疑熟悉的世界图景。易空还教他设身处地、少凭意气行事。1973年春老人重返民航，后来寄来的英文图解辞典继续陪伴他的求学。","stakes":"知识和见闻受政治身份限制，求知需要信任与安全的谈话空间。","action":"共享书刊、请教疑问、学习处世，在易空离开后保持联系。","change":"从外部世界的单一印象走向好奇；认识知识、谦和与尊严可在被贬斥的人身上并存。","people":[{"name":"易空","role":"两航起义参与者、被下放养猪的航空专家，良师益友"},{"name":"黄树荣","role":"猪班副班长，共同照料易空和猪群的朋友"}],"chapter_id":"chapter-18","pdf_pages":[248,249,250,251,252,253,254,255,256,257,258,259,260],"quote":{"text":"世界上没有不散的宴席，好事会到头，坏事也会到头，不必悲伤。我们在患难中创建起来的友谊是永久的。","pdf_page":259},"editorial_note":"辞典扉页题字日期为73.11.18，并非能确定的收到包裹日期。","stage":"possibility","tags":["learning","care"],"notes":["辞典扉页题字日期为1973年11月18日；这不等于作者收到包裹的日期。"],"map_place":"wulate","person_ids":["yi-kong"]},{"id":"gobi-reading-and-making-friends","title":"工具棚夜读，营房间交朋友","date_label":"1972年9月挨批判后，延续到以后招生","place":"五连各班宿舍、试验班工具棚、排球场","summary":"为升学朋友饯行时，他开玩笑说将来在巴黎伦敦重聚，竟被告密并公开批判。痛苦之后，他决定每天拿出一小时串门，同时在工具棚用土坯、铁锹搭桌凳，遮住煤油灯继续读书。为了让更多人认识自己，他又自学排球规则当裁判，把求知与结交朋友一道坚持下来。","stakes":"读书被指动机不纯，孤立可能让下一次机会彻底消失。","action":"每天定时走访同伴；藏身工具棚夜读；请父亲寄规则手册并担任排球裁判。","change":"开始把知识与理解人的需要结合；后来两次高票推荐使这段改变产生实际后果。","people":[{"name":"张松森及连队领导","role":"发动人生观教育批判"},{"name":"父亲","role":"寄来排球规则手册"},{"name":"五连男女战友","role":"由疏远的旁观者逐渐成为认识他、支持他的群体"}],"chapter_id":"chapter-20","pdf_pages":[272,273,274,275,276],"quote":{"text":"后来才知道，人缘改变了我的命运。","pdf_page":275},"stage":"possibility","tags":["learning","choice"],"notes":[],"map_place":"wulate","person_ids":[]},{"id":"gobi-letter-on-horseback","title":"受伤以后，仍把信寄了出去","date_label":"1973年10月8日","place":"五连马厩 → 分团部诊所外 → 分团部邮箱","summary":"他与李荣田、华振浩共同起草署名信，向毛泽东和周恩来陈述兵团对青年、地方与国家的三重伤害。为避开连部，他骑无鞍马去寄信，转弯惊马，右眉被马蹄踩伤。包扎后仍把信投入邮箱，请北京亲人转寄；母亲誊改寄出的一封，后来成为阻挡他升学的隐患。","stakes":"署名意味着可能报复，经连部寄送也可能遭截留。","action":"三人反复讨论并署名，骑马绕开连部邮路，受伤仍完成投递。","change":"从私下不满转为试图改变共同处境；一年后承担真实的个人代价。","people":[{"name":"李荣田","role":"共同起草、署名，并在后来发现信件下转文件"},{"name":"华振浩","role":"共同起草和署名的读书伙伴"},{"name":"母亲","role":"修改、誊写并转寄信件"},{"name":"刘小彤的父亲","role":"收到另一封信但因担忧风险未转寄"}],"chapter_id":"chapter-17","pdf_pages":[237,238,239,240,241],"quote":{"text":"回到营房，我大大地松了一口气。尽管我受伤了，但是信发出去了。","pdf_page":240},"stage":"possibility","tags":["choice"],"notes":[],"map_place":"wulate","person_ids":["parents","li-rongtian"]},{"id":"gobi-1974-rejected","title":"第二名，仍没有他的名字","date_label":"1974年8月16日投票，数周后获知未批","place":"五连招生会议、集合场与营房外荒野","summary":"1974年招生采用群众投票，他意外进入招生小组，也在推荐中得票第二。连里确认他在上大学名单中，他谨慎等待数周，却在正式宣读时发现自己被删去。他先祝贺入选朋友，深夜独自跑进荒野放声痛哭；后来才知道，寄往北京的告状信已经转回兵团。","stakes":"升学意味着彻底离开戈壁，但群众推荐还须层层审批。","action":"参与投票工作、继续苦干，失望后仍约束表情并决定等待下次机会。","change":"同伴的支持与组织的审批并不总是一回事。失败之后，他仍选择继续准备下一次机会。","people":[{"name":"李荣田","role":"后来发现刊载告状信的文件，告知受阻缘由"},{"name":"张松森","role":"提名他入招生小组，后宣布团部批准名单"},{"name":"黄树荣","role":"同年获准去北京钢铁学院的好友"}],"chapter_id":"chapter-20","related_chapter_ids":["24-chapter-21"],"pdf_pages":[276,277,278,279,281,282],"quote":{"text":"我必须坚持下去，继续努力，等待下一次机会。","pdf_page":279},"editorial_note":"1974年团部以年龄较轻作解释；报复性排除是作者根据李荣田发现的文件和自身经历作出的判断，应保持叙述归属。","stage":"possibility","tags":["choice"],"notes":["团部以年龄较轻解释未获批准。作者根据李荣田发现的文件和自身经历，将此事理解为报复性排除；本页保留这一叙述归属。"],"map_place":"wulate","person_ids":["li-rongtian"]},{"id":"gobi-1975-alternate","title":"118票之后，还有一道道门","date_label":"1975年8月10日起，至9月等待期间","place":"五连 → 坝头团部医院 → 师部审核","summary":"次年他以一百一十八票再居第二，招生小组也多数赞成，指导员公布的名单却仍没有他。战友替他抱不平，连里才加报候补。体检紧张造成的异常被于医生在表格上改为正常；两名候选人遭淘汰后，团里又把他退回候补。支持、援手与阻力一层层交织，结果依然悬着。","stakes":"连队、团部、体检、学校与师部每一关都能使升学资格消失。","action":"保持劳动和自学、打探进展，体检遇阻时找到于医生。","change":"投票支持必须穿过层层审核才可能成为入学资格；这次机会还在变化之中。","people":[{"name":"张英建（老九）","role":"得票第一的副排长，转告招生小组内部情况"},{"name":"于医生","role":"没有复检而改写体检表，使他通过；需忠实保留这一复杂事实"},{"name":"知青出身的三名团党委委员","role":"支持其候补资格"},{"name":"陈德才","role":"因肺部阴影被淘汰的同伴，突显规则的残酷"}],"chapter_id":"chapter-21","pdf_pages":[282,283,284,285,286],"quote":{"text":"我排名第二，仅仅比他少了几张选票，得到118票，比去年还多了25票。","pdf_page":283},"stage":"possibility","tags":["care","choice"],"notes":[],"map_place":"wulate","person_ids":["doctor-yu"]},{"id":"gobi-exam-ready","title":"五页作文，让准备被看见","date_label":"1975年9月，正式通知录取前","place":"乌拉特前旗师部的一间小屋","summary":"他忽然被叫到师部考试，只需朗读报纸、写一篇作文。他把六年劳动和用三角学丈量土地的经历写成五页，令招生老师满意。原想报录取机会较大的内蒙古大学中文，却遇上外贸学院寻找年轻、会读写中文的外语学生。年龄曾被用作淘汰理由，此时反成了机会。","stakes":"候补资格尚不稳定，必须符合招生学校对学习能力的要求。","action":"朗读短文、快速完成作文，说明自学英语经历并接受老师建议学英语。","change":"多年积累与特定招生需求终于相接，获得学校认可但仍须师部批准。","people":[{"name":"李国忠","role":"北京对外贸易学院招生老师，面试并建议他学英语"}],"chapter_id":"chapter-21","pdf_pages":[286,287,288],"quote":{"text":"我说很多人上学的目的是回城，而我确实渴望去学习，任何大学要我，我都心满意足，学什么都可以。","pdf_page":287},"editorial_note":"考试未给精确日号；只能确定在9月14日获批通知之前。勿把面试通过当作正式录取或入学。","stage":"possibility","tags":["learning","choice"],"notes":["原书未给出考试的具体日号，只能确定在9月14日获批通知之前。面试通过、正式获批与入学是不同的节点。"],"map_place":"wulate","person_ids":[]},{"id":"gobi-leaving-same-day","title":"消息传来，当晚就走","date_label":"1975年9月14日","place":"分团部电话总机 → 五连 → 乌拉特前旗 → 开往北京的火车","summary":"探望王大成时，接线员悄悄告诉他：刚才电话通知的升学名单有他。赶回连部，指导员正式批准他赴北京外贸学院学外语。他当天只拿书包搭车离开，又骑走未上锁的自行车赶买车票，随后归还解释。当晚火车开动，他才真正安心，却发现把朝夕相伴的铁锹忘在身后。","stakes":"担心决定被推翻，急切逃离使他冒险骑走别人的自行车。","action":"向朋友道别、留下物品、搭拖拉机到前旗，买票归还自行车，当晚登车。","change":"从等待批准的人变为真正离开戈壁的人；解脱里夹着对工具、土地与朋友的留恋。","people":[{"name":"王大成","role":"分团部朋友，提供获知消息的偶然场所"},{"name":"两位未具名接线员","role":"率先告诉他获批消息，表达信任"},{"name":"张松森","role":"正式告知师部批准、可随时报到"},{"name":"李宝权","role":"接受他匆忙留下的生活物品"}],"chapter_id":"chapter-21","pdf_pages":[288,289,290],"quote":{"text":"当天晚上，我登上了去北京的火车，提到嗓子眼的心，终于落下去了。","pdf_page":290},"stage":"possibility","tags":["choice"],"notes":[],"map_place":"wulate","person_ids":["li-baoquan"]},{"id":"return-to-beijing","title":"回到有电灯的课堂，噩梦仍未结束","date_label":"1975年9月返京；10月10日正式入学","place":"北京 · 对外贸易学院","summary":"在戈壁度过六年后，单伟建回到北京，在外贸学院学习英语。电灯、热水和足够的饭食已令他满足，但被遣回兵团的噩梦反复出现。他重新纠正自学留下的发音漏洞，刻苦练习听说，又大量阅读课外书，为后来通过出国考试积累知识。","stakes":"入学资格已改变命运，失学六年的恐惧却没有立刻消失；自学基础也存在缺口。","action":"办理入学、纠正发音、每日听录音并大声背诵，以课外阅读补充进度。","change":"从受支配的农场劳动者成为英语学生，终于有稳定的学习环境。","people":[{"name":"王克礼","role":"英语课主任，温和关照学生。"},{"name":"何曾楣","role":"随时解答问题、举一反三，提供扎实的英语训练。"},{"name":"屠珍、柴君雄","role":"提供高水平英语教学与关爱。"},{"name":"陈民","role":"同班同寝的北京同学，后来共同经历天安门事件。"}],"chapter_id":"chapter-22","pdf_pages":[294,295,296,297,298,310],"quote":{"text":"这个梦缠绕了我十几年，只不过开始的时候经常做，多年之后偶然重复同样的梦，用「心有余悸」描述我的心理，恰如其分。","pdf_page":296},"date_note":"返京日期见PDF294；1975年10月10日是PDF310毕业证记载的正式入学日，二者不要混为一日。","stage":"classroom","tags":["learning"],"notes":["返京经过见PDF第294页；1975年10月10日是第310页所载毕业证记载的正式入学日。"],"map_place":"beijing","person_ids":[]},{"id":"tiananmen-1976","title":"赶上末班车，避开广场上的镇压","date_label":"1976年4月4—5日","place":"北京 · 天安门广场","summary":"周恩来逝世后的清明节，单伟建到天安门看见花圈、诗词和公开的抗议。次夜他和陈民赶末班车离去，错过随后的镇压。学校追查时，他几乎把记在脑中的诗词全背出来，书记却示意噤声。这次经历使宏大政治与个人安危直接相遇。","stakes":"广场活动被定为反革命，去过广场和保存照片都可能牵连自己与父母。","action":"现场观察拍照，与陈民于清场前离开；接受询问时如实承认到场。","change":"认识到政治判断可以突然翻转，也发现制度中的个人能以善意保护他人。","people":[{"name":"陈民","role":"与他同赴广场并赶末班车回校。"},{"name":"陆祖文","role":"英语系党支部书记，提醒他不要向外人复述诗词，实际保护他。"}],"chapter_id":"chapter-22","pdf_pages":[301,302,303],"quote":{"text":"我一下子明白了，他不是要找我的麻烦，而是在保护我。","pdf_page":303},"stage":"classroom","tags":["care"],"notes":[],"map_place":"beijing","person_ids":[]},{"id":"marry-shibin","title":"误诊与贫困没有拆散这段婚姻","date_label":"1977年1月相识；1979年10月27日结婚","place":"北京 · 王政办公室、太阳宫","summary":"替母亲送东西时，单伟建遇见石滨，她刚在唐山地震中失去父亲和两个妹妹。两人决定结婚后，他又被误诊为患有绝症，石滨仍决定相守。他骑车载她到太阳宫登记，穿着兵团旧棉袄吃了家宴，新婚生活从合住房间和办公室拼椅床开始。","stakes":"石滨承受丧亲之痛，又面对伴侣可能患绝症的恐惧；住房和物资均匮乏。","action":"面对家人反对仍决定结婚；在简陋生活中共同建立家庭。","change":"石滨成为随后求学与远行的同行者，家庭团聚也成为留学阶段最持续的牵挂。","people":[{"name":"石滨","role":"妻子，坚持婚约，随后支持求学并承担家人的照护。"},{"name":"王政","role":"两人的相识由她介绍。"},{"name":"石滨的母亲","role":"医生，安排复查；后来新婚夫妇借住她的房间。"}],"chapter_id":"chapter-23","pdf_pages":[312,313,316,317,319],"quote":{"text":"石滨也想通了，说嫁鸡随鸡嫁狗随狗，还是决定和我结婚。","pdf_page":316},"date_note":"PDF317给出明确登记日；PDF374回顾写“我们1980年结婚”，内部矛盾，不能沿用后者。","stage":"classroom","tags":["care"],"notes":["原书第317页给出1979年10月27日的明确登记日期；第374页回顾写“我们1980年结婚”。这里采用前者，保留原书内部的年份差异。"],"map_place":"beijing","person_ids":["shibin"]},{"id":"choose-study-over-un","title":"两条去美国的路，他选择重新读书","date_label":"1979年联合国招考—1980年春访问学者选拔","place":"北京 · 第一外国语学院、对外贸易学院","summary":"毕业留校后，单伟建参加联合国同声翻译招考，面试失常却获下一期录取。随后他在亚洲基金会考试中居首。联合国意味着高薪、研究生待遇与夫妻同行，他仍选择津贴较低、必须独行的访问学者项目，因为渴望补回失去的正规教育并取得学位。","stakes":"能否摆脱工农兵学员缺少正式学位的身份；机会与新婚分离之间必须取舍。","action":"接连尝试考试，主动选择访问学者而放弃同声翻译路线。","change":"人生从英语教学和翻译职业转向赴美求学，长期学习取代眼前待遇成为决策理由。","people":[{"name":"高国沛","role":"系主任，鼓励已有联合国录取的他继续尝试亚洲基金会考试。"},{"name":"张载梁","role":"联合国语言训练班负责人，通知下一期录取并持续催他返京报到。"},{"name":"石滨及父母","role":"理解并支持他牺牲待遇换取学习机会。"}],"chapter_id":"chapter-23","pdf_pages":[310,311,313,314,315,319,320,321,322],"quote":{"text":"因为我觉得小学之后，就再也没有接受过正规教育，我渴望上学，希望到了美国，经过努力，拿到一个正式的学位。","pdf_page":321},"stage":"classroom","tags":["learning","choice"],"notes":[],"map_place":"beijing","person_ids":["shibin"]},{"id":"usf-degree-obstacle","title":"想读学位，先遇到学费门槛","date_label":"1980年8月28日起","place":"北京—东京—旧金山 · USF孤独山","summary":"第一次坐飞机跨过太平洋，单伟建在旧金山大学成为访问学者。到校才知道旁听不能获得学位，法律博士要读三年并缴费。他四处求助，教授们替他设计法律与商学合修的硕士方案，学费却仍无着落。他决定照样修读，先把学问拿到手。","stakes":"为学位而来的计划几乎落空，资助只有一年，支付学费的能力为零。","action":"向卡苏、戈尔威和莫里求教，争取定制课程，并在未能注册学位时仍认真学习考试。","change":"第一次体验自主选择与灵活教育安排，也第一次明确感到金钱会阻断求学。","people":[{"name":"安迪·安德鲁斯","role":"亚洲基金会项目负责人，接机、安顿并建议学习法律。"},{"name":"艾普丽尔·卡苏","role":"法学院副院长，与两院教师共拟学位计划。"},{"name":"杰克·戈尔威","role":"合同法教授，将他介绍给商学院。"},{"name":"比尔·莫里","role":"商学院教授，牵头设计压缩的MBA课程方案。"}],"chapter_id":"chapter-24","pdf_pages":[324,326,327,328,329,330,336,337],"quote":{"text":"学位是给别人看的，学问可是自己的。","pdf_page":337},"stage":"pacific","tags":["learning","choice"],"notes":[],"map_place":"sanfrancisco","person_ids":["casous"]},{"id":"anonymous-donor-mba","title":"一笔匿名捐款的来处","date_label":"1981年1月—1982年1月9日","place":"旧金山 · USF、蓝狐餐厅、律师事务所","summary":"第一学期的成绩证明他能够完成课程，匿名捐款随即解决了学费。他又建议基金会用贺电争取北京批准延期。四月晚餐才知恩人正是卡苏夫妇。基金会生活费到期后，卡洪提供住处和律所工作，使他终于在1981年圣诞节前读完MBA课程，次年返京。","stakes":"学费、访问期限和生活费三重障碍都可能让学位半途而废。","action":"用成绩赢得信任，提出发贺电的沟通方法，继续密集修课并从事法律研究工作。","change":"获得第一个正式研究生学位；陌生人的帮助形成一生记住并日后回馈的恩情。","people":[{"name":"艾普丽尔·卡苏、菲尔·卡苏","role":"匿名支付全部学费；1981年4月15日揭晓身份。"},{"name":"安迪·安德鲁斯","role":"按建议向外贸学院发贺电，促成延期认可。"},{"name":"桑迪·卡洪、康妮·卡洪","role":"提供住处，桑迪又安排律所职位补足生活费。"},{"name":"鲍勃·派特森","role":"律所上司，交付法律研究任务。"}],"chapter_id":"chapter-25","pdf_pages":[339,340,341,342,343,347,348,349],"quote":{"text":"在美国呆了一年零三个月后，我于1981年圣诞节前完成了工商管理硕士的全部课程。","pdf_page":349},"stage":"pacific","tags":["learning","care"],"notes":[],"map_place":"sanfrancisco","person_ids":["casous","calhouns"]},{"id":"berkeley-math","title":"一本线性代数，读了七遍","date_label":"1982年春获录取；8月21日重返美国","place":"北京 · 外贸学院—伯克利 · 加州大学","summary":"回北京边学边教经济学时，他收到附全额奖学金的博士录取。美国友人说服校方后，他再度离开妻子赴美。面对自小学以来没有正规数学训练的缺口，他先退掉过难的微观经济课，再把线性代数课本读了七遍，以不断调整方法弥补教育断层。","stakes":"再次出国需要批准；博士课程要求的数学基础不足，奖学金也取决于成绩。","action":"耐心教学等待批准，听取导师建议调整选课，以反复读书做题补基础。","change":"由追赶学历进入系统的学术训练，也认识到努力需要配合合理的学习顺序。","people":[{"name":"许世伟","role":"外贸学院副校长，在美国友人推动下批准再次出国。"},{"name":"迪克·霍尔顿","role":"协助博士申请和奖学金。"},{"name":"珍妮特·耶伦、乔治·阿克洛夫","role":"提醒数学门槛，建议先修工具课。"},{"name":"台湾同学","role":"在困难的线性代数学习中提供帮助。"}],"chapter_id":"chapter-26","pdf_pages":[353,354,355,357,358,359,360,361],"quote":{"text":"到了学期末，我算了一下，我已经把这本书通读了七遍。最终，这门课我得了个A+，深感来之不易。","pdf_page":360},"stage":"pacific","tags":["learning"],"notes":[],"map_place":"berkeley","person_ids":["yellen"]},{"id":"family-reunion","title":"跨过太平洋的一家三口","date_label":"1983年4月13日儿子出生；1984年6月30日夫妻团聚；1985年8月底全家团聚","place":"北京—伯克利 · 奥尔巴尼学生村","summary":"单伟建隔海得知儿子出生，石滨一面工作，一面照顾病母与婴儿。配偶陪读政策开放后，她终于赴美，孩子却仍被留在北京。1985年暑假，她坚持奔走办理儿子的出国手续；八月底一家三口才在湾区相聚，拮据的学生公寓成为真正完整的家。","stakes":"留学家庭被政策和经济条件分隔；照护压力集中在石滨和两边父母身上。","action":"以石滨个人留学申请争取机会，利用政策开放及时办证；石滨持续游说携子出国。","change":"从两岸书信维系婚姻，走到独门独户和一家三口共同生活。","people":[{"name":"石滨","role":"照护病母、育儿、申请留学，并最终独力办成儿子出国。"},{"name":"单博（磊磊）","role":"1983年出生，1985年与父母团聚。"},{"name":"单伟建父母","role":"在北京照顾留守的孙子。"},{"name":"袁伦仁","role":"亚洲基金会负责人，提供签证材料和财务支持证明。"},{"name":"尼尔森·徐","role":"资助1983年底回家机票，使他第一次见到儿子。"}],"chapter_id":"chapter-27","source_chapters":["chapter-26","chapter-27"],"pdf_pages":[361,362,363,364,368,369,370,371,372,373,374],"quote":{"text":"虽然靠我的助学金生活，手头拮据，但我们很满足很幸福。","pdf_page":374},"stage":"pacific","tags":["care","choice"],"notes":[],"map_place":"berkeley","person_ids":["parents","shibin"]},{"id":"teacher-researcher","title":"从答疑到研究，学会做一名学者","date_label":"1983年秋—1985年","place":"伯克利 · 国际屋、哈斯商学院、旧金山湾区","summary":"耶伦介绍单伟建担任提斯的助教，大班授课与随时找上门的学生让他疲惫，却也训练了教学能力。1984年他被学生选为最佳助教；次年开始研究制药巨头与生物技术初创企业的合作，走访湾区公司、建立数据库，从补课转入原创研究。","stakes":"备课、答疑、自己的课程和家人赴美事务叠加；需要从掌握知识走向生产知识。","action":"认真辅导学生，随后以企业实地调查和统计数据研究合作模式。","change":"确认喜爱教学，形成博士论文的研究主题，为未来教职积累基础。","people":[{"name":"珍妮特·耶伦","role":"推荐他担任助教，并指导经济学硕士的选课安排。"},{"name":"大卫·提斯","role":"聘为国际商业导论助教，后来担任博士论文委员会主席。"},{"name":"哈斯商学院学生","role":"投票选他为最佳助教。"}],"chapter_id":"chapter-27","pdf_pages":[368,371,372,375,376],"quote":{"text":"尽管如此，这是一段有益的经历，我喜欢教学，尤其喜欢与学生交互。","pdf_page":368},"stage":"pacific","tags":["learning","care"],"notes":[],"map_place":"berkeley","person_ids":["yellen","teece"]},{"id":"phd-world-bank","title":"完成博士，一家人乘火车驶向下一站","date_label":"1986年12月完成博士；1987年1月入职世界银行","place":"伯克利—奥克兰—丹佛—芝加哥—华盛顿","summary":"博士完成后，大学尚未进入新学年的聘任期，他先接受世界银行的工作。一家三口于12月29日从奥克兰登车横穿美国，在丹佛和芝加哥停留访友，再到华盛顿安顿。他从第一天便在同事指导下交易加拿大国债，把经济学知识用于真实的金融市场。","stakes":"从求学转向职业，既需收入，也要寻找教职；一家人第一次能够从容安排远行。","action":"参加青年专业人员计划，先积累银行经验，同时保留大学任教目标。","change":"正式结束博士训练，成为有职业收入的金融从业者，但学术志向尚未改变。","people":[{"name":"石滨、单博","role":"一同横穿美国并迁居阿灵顿。"},{"name":"世界银行资深同事","role":"在实际交易中指导他开展政府债券买卖。"}],"chapter_id":"chapter-28","source_chapters":["chapter-27","chapter-28"],"pdf_pages":[377,378,380,381,382],"quote":{"text":"1986年12月我完成了博士学位，次年1月开始在世界银行工作。","pdf_page":380},"date_note":"博士完成时间明确是1986年12月；若图片标1987年毕业典礼，应分别标注学位完成与典礼，正文检索未找到典礼文字。","stage":"choices","tags":["learning"],"notes":["博士完成时间为1986年12月（PDF第380页）；前言提到的1987年毕业聚会与学位完成时间分别理解。"],"map_place":"washington","person_ids":["shibin"]},{"id":"wharton-choice","title":"世界银行与沃顿之间，选择教学","date_label":"1987年3月20日选定沃顿；7月底离开世行","place":"华盛顿—费城／波士顿—新泽西樱桃山","summary":"提斯推荐后，沃顿与MIT等学校向他发出面试邀请，最终两校都提供教职和冠名教授席位。比较资源、城市与导师建议仍难决断，他和妻子商量以抛硬币作选择，去沃顿任教。全家迁居樱桃山，他开始在研究自由与发表压力之间学习教授的工作。","stakes":"两个顶尖机会无法兼得；担心学术功底浅，不能回应学校的期待。","action":"反复访校、咨询导师、与妻子商量，最后接受沃顿聘请并离开世行。","change":"从等待组织安排的人，走到能在竞争他的机构之间作出职业选择。","people":[{"name":"大卫·提斯","role":"以学术声誉推荐教职，并建议选择资源充裕的沃顿。"},{"name":"布鲁斯·科格特","role":"接待、交流并以决策树笑话缓解选择焦虑。"},{"name":"石滨","role":"共同商量最终去向。"},{"name":"珍妮特·耶伦、乔治·阿克洛夫","role":"提供关于两校的不同意见。"}],"chapter_id":"chapter-28","pdf_pages":[382,383,384,385,386,387,388,389,391,393],"quote":{"text":"最终，我和妻子商量决定干脆抛个硬币，落在哪家去哪家。结果我选择了去沃顿商学院，那天是1987年3月20日。","pdf_page":387},"stage":"choices","tags":["choice"],"notes":[],"map_place":"philadelphia","person_ids":["shibin","yellen","teece"]},{"id":"visa-crisis","title":"一处填错的方框，几乎迫使全家离境","date_label":"1988年9月15日起，历时五个多月","place":"费城／华盛顿；法国枫丹白露为备选去向","summary":"刚适应沃顿生活，全家却收到离境通知。原因竟是石滨签证材料被错填成公派留学。单伟建停下工作反复交涉，同事代课、校友联络官员、旧上司介绍移民律师。他也到法国争取后备教职；经历再次催离和文件遗失后，问题才在多人帮助下解决。","stakes":"有效签证下突然面临驱逐，工作与全家生活都无法安排。","action":"收集私费证据、寻求专业律师与校方支持，并为可能离境准备教职退路。","change":"体会美国官僚体系的任意性，也再度依靠朋友、同事与陌生人的帮助渡过危机。","people":[{"name":"鲍勃·派特森","role":"旧律所上司，迅速转介专业移民律师。"},{"name":"布莱恩·麦克吉尔","role":"研究并处理移民案。"},{"name":"拉塞尔·帕尔默、杰夫·希恩","role":"沃顿领导，联系华盛顿关系协助。"},{"name":"布鲁斯·科格特","role":"替他代课。"},{"name":"乔恩·亨斯曼、洪博培","role":"帮助联系参议员与政府机构。"}],"chapter_id":"chapter-29","pdf_pages":[399,400,401,402],"quote":{"text":"在必须准备离境的不确定性笼罩之下，我无法计划工作，也无法安排全家的生活。","pdf_page":399},"stage":"choices","tags":["care","choice"],"notes":[],"map_place":"philadelphia","person_ids":[]},{"id":"return-to-asia","title":"从费城到香港，再次出发","date_label":"1990年回国办班；1993年春接受聘请并迁港","place":"费城—上海／北京—香港","summary":"1989年后的动荡令他担忧改革前途，回国举办管理培训班时却看见官员认真学习市场经济。南巡后，他相信新的机遇正在出现。任教六年后，单纯研究已难满足他；他接受摩根大通中国投资银行业务的职位，与妻子、儿女离开美国，迁居香港。","stakes":"回亚洲意味着放弃教职、妻子工作与一家人熟悉的生活，孩子也须重新适应。","action":"以回国观察判断改革方向，将教学积累转向商业实践，接受银行聘请。","change":"叙事主线从失学者成为学者，推进到主动离开学术界；投资银行生涯在门口展开。","people":[{"name":"石滨","role":"随全家迁居，需要放弃原有工作。"},{"name":"单博、莲莲","role":"共同迁居；女儿于1991年出生。"},{"name":"莫若愚","role":"资助1990年沃顿在上海交通大学举办管理培训班。"},{"name":"朱镕基","role":"时任上海市长，支持培训项目延续。"}],"chapter_id":"chapter-29","pdf_pages":[402,403,404,410,411,412],"quote":{"text":"很快，我们举家离开美国迁往香港，掀开了生活的新一章。","pdf_page":412},"stage":"choices","tags":["choice"],"notes":[],"map_place":"hongkong","person_ids":["shibin"]},{"id":"return-old-neighbours","title":"还留在这里的战友","date_label":"2005年7月10日","place":"五连旧址及附近村庄","summary":"李永芝一眼就叫出了他的名字，王双喜却因腿伤只能坐在床上招呼。这对夫妇仍在戈壁靠养猪谋生，女儿已经到北京工作。他们带作者找旧营房：土坯房消失了，开垦的田地被湖水淹没。重逢的喜悦，与被土地吞没的青春留在同一个画面里。","stakes":"三十年改变了生活条件，也拉开了昔日同伴的人生距离。","action":"拜访李永芝、王双喜一家，请他们带路寻找五连的旧营房和砖窑。","change":"同样的青春岁月之后，有人远行，有人留下。个人经历在重逢中重新接上了一代人的记忆。","people":[{"name":"李永芝、王双喜（二喜）","role":"仍留在当地生活的战友，接待作者并介绍近况。"},{"name":"王慧","role":"李永芝的女儿，陪同寻找旧营房。"}],"chapter_id":"afterword","pdf_pages":[417,418],"quote":{"text":"那一排排我和战友们亲手所盖的土坯房，已经荡然无存，没有留下丝毫痕迹，烟消云散在大漠之中。","pdf_page":418},"stage":"return","tags":["care"],"notes":[],"map_place":"wuliang","person_ids":["old-neighbours"]},{"id":"return-reed-ruins","title":"坐上二狗的摩托车，再去打苇的地方","date_label":"2005年7月10日","place":"乌梁素海、南场村、翻身圪坦","summary":"在荒漠中问路时，他偶然认出了二狗。旧案和其后的经历长期限制了这位战友的出路，使他最终又回到戈壁。两人谈起共同的过去，没有距离感。汽车无法再前进，作者坐上二狗的摩托车去找当年的打苇驻地；最后见到的，是沙丘间几排近乎坍塌的房子。","stakes":"对于昔日战友，一次被定罪的经历可能长久改变求职与生活的可能。","action":"听二狗讲述这些年的遭遇，随他重访南场村和翻身圪坦。","change":"全书在旧址前停下：走出戈壁的人仍需记得，没有同样走出来的人。","people":[{"name":"二狗","role":"昔日战友，讲述后来的遭遇并骑摩托车带作者寻访旧址。"}],"chapter_id":"afterword","pdf_pages":[419,420],"quote":{"text":"尽管现在我们俩生活在完全不同的世界里，但我们回忆共同的过去，毫无距离感。","pdf_page":420},"editorial_note":"二狗的后续经历由作者在重逢时听其讲述。本页呈现回忆录中的叙述，不独立裁定旧案。","stage":"return","tags":["care","choice"],"notes":["二狗的后续经历由作者在重逢时听其讲述。本页呈现回忆录中的叙述，不独立裁定旧案。"],"map_place":"wuliang","person_ids":["ergou"]}],"people":[{"id":"parents","name":"父母：单毅、王文丽","role":"家一直在远方相随","bio":"母亲把口粮留给孩子，父亲准备行装、寄来食品与书。离家以后，信件让彼此继续参与对方的生活。姓名据原书家庭照片图注。","events":["early-family-hunger","early-books-from-fire","early-beijing-to-gobi","early-reed-division-of-labor","gobi-winter-borrowed-warmth","gobi-letter-on-horseback","family-reunion"]},{"id":"li-baoquan","name":"李宝权","role":"能分一口水的伙伴","bio":"幽默、直率的天津同伴。稀缺的饮水与食物可以分享，离开时留下的物品也交给了他。","events":["early-potatoes-letter-home","gobi-leaving-same-day"]},{"id":"liu-xiaotong","name":"刘小彤","role":"一起劳动，也保存记忆","bio":"打芦苇时的搭档，多才多艺的战友。书中戈壁时期照片由他拍摄，留下了许多今天仍能看见的共同经历。","events":["early-reed-division-of-labor","gobi-canal-31-hours"]},{"id":"li-rongtian","name":"李荣田","role":"读书与动手的同路人","bio":"铁匠学徒、交换书籍的朋友。他与作者一起研究制砖机器、起草告状信，也把唯一的大头鞋借给作者过冬。","events":["gobi-winter-borrowed-warmth","gobi-brick-machine","gobi-letter-on-horseback","gobi-1974-rejected"]},{"id":"cui-xianchao","name":"崔贤超","role":"把现实说清楚的人","bio":"在土豆地归来的路上劝他读书、寻求出路。严冬来临时，又把皮帽让给了他。","events":["early-potatoes-letter-home","gobi-winter-borrowed-warmth"]},{"id":"doctor-yu","name":"于医生","role":"两次转折中的援手","bio":"看到他读医书，推荐他参加卫生员训练；四年后升学体检受阻，又在关键处相助。原书保留了后一次帮助的复杂细节。","events":["gobi-barefoot-training","gobi-1975-alternate"]},{"id":"gao-xiaorong","name":"高晓荣","role":"共同守过一夜的同事","bio":"比他更有经验的卫生员，与他一起照料危重孩子。这里的成就属于合作，也来自对具体生命的责任。","events":["gobi-child-in-clinic"]},{"id":"yi-kong","name":"易空","role":"猪班里的良师益友","bio":"被下放养猪的航空专家，以见闻、书籍和处世经验启发年轻的作者。地理上仍在戈壁，谈话却打开了另一个世界。","events":["gobi-yi-kong"]},{"id":"shibin","name":"石滨","role":"共同作决定、推动团聚","bio":"两人在北京相识。她在留学分离中承担工作、照护和育儿，又奔走办理儿子的赴美手续；她也是职业迁移决定中的共同商量者。","events":["marry-shibin","choose-study-over-un","family-reunion","phd-world-bank","wharton-choice","return-to-asia"]},{"id":"casous","name":"卡苏夫妇","role":"匿名付清学费的老师与家人","bio":"艾普丽尔·卡苏与丈夫菲尔承担了单伟建在USF的学费。捐助先于身份揭晓，使一条濒临中断的求学之路得以继续。","events":["usf-degree-obstacle","anonymous-donor-mba"]},{"id":"calhouns","name":"卡洪夫妇","role":"资助结束之后的住处","bio":"桑迪与康妮提供住处，桑迪又帮助安排律师事务所工作，支持他在生活费中断后完成学业。","events":["anonymous-donor-mba"]},{"id":"yellen","name":"珍妮特·耶伦","role":"看见缺口，也看见潜力","bio":"博士导师之一。她建议调整修课顺序，介绍助教机会，并在多年后为本书写下前言。","events":["berkeley-math","teacher-researcher","wharton-choice"]},{"id":"teece","name":"大卫·提斯","role":"从助教到学者的引路人","bio":"聘用他担任助教，后来主持博士论文委员会并推荐教职。求学的下一步，逐渐变成研究与教学。","events":["teacher-researcher","wharton-choice"]},{"id":"old-neighbours","name":"李永芝、王双喜","role":"仍在戈壁生活的故人","bio":"2005年重访时，作者见到仍留在当地养猪谋生的这对夫妇。女儿已经到北京工作，另一代人的迁移仍在继续。","events":["return-old-neighbours"]},{"id":"ergou","name":"二狗","role":"带他回到旧驻地的人","bio":"昔日遭遇长期影响了他的出路。三十年后偶然重逢，他骑摩托车带作者重访打芦苇的地方。原书保留昵称，本页不补写真名。","events":["return-reed-ruins"]}],"places":[{"id":"shandong","name":"山东","lon":119.0,"lat":36.3,"precision":"省域示意","note":"出生地记为山东省；1968年曾在牟平亲戚家劳动。两处不视为同一个村庄。"},{"id":"beijing","name":"北京","lon":116.4,"lat":39.9,"precision":"城市级","note":"童年、失学与返京求学的城市。"},{"id":"wulate","name":"乌拉特前旗","lon":108.65,"lat":40.73,"precision":"地域级","note":"到达戈壁与离开时的交通节点。五连、砖窑及工具棚只标所属地域，不推定旧址坐标。"},{"id":"wuliang","name":"乌梁素海","lon":108.9,"lat":40.95,"precision":"湖泊地域级","note":"冬季打芦苇与2005年重访的核心地域。具体打苇驻地在场景文字中说明。"},{"id":"baotou","name":"包头","lon":109.84,"lat":40.66,"precision":"城市级","note":"2005年重返内蒙古的航空到达点。"},{"id":"sanfrancisco","name":"旧金山","lon":-122.42,"lat":37.77,"precision":"城市级","note":"旧金山大学（USF）访问与硕士求学。"},{"id":"berkeley","name":"伯克利","lon":-122.27,"lat":37.87,"precision":"城市级","note":"加州大学博士训练、教学与家庭团聚；书中译作柏克莱。"},{"id":"washington","name":"华盛顿","lon":-77.04,"lat":38.9,"precision":"城市级","note":"1987年在世界银行工作，家庭居于邻近的阿灵顿。"},{"id":"philadelphia","name":"费城","lon":-75.17,"lat":39.95,"precision":"城市级","note":"沃顿商学院任教；家庭居于新泽西樱桃山。"},{"id":"hongkong","name":"香港","lon":114.17,"lat":22.3,"precision":"城市级","note":"1993年全家迁居香港，开始投资银行工作。"}],"threads":[{"id":"learning","name":"求知","subtitle":"书从哪里来，学习通向哪里","intro":"从科技馆的电路、火边捡来的书，到工具棚和大学课堂，学习的场所不断改变。每次学习能否变成机会，又取决于不同的条件。"},{"id":"care","name":"相助","subtitle":"半个窝头、一双鞋、一笔学费","intro":"帮助以具体的东西出现：母亲留下的口粮、朋友借出的衣物、教授支付的学费，以及妻子为团聚奔走的手续。每个人做的事都不同。"},{"id":"choice","name":"选择","subtitle":"从被安排，到能够作决定","intro":"前半生常常需要等待批准，后来他开始在不同机会之间选择。但政策、身份与家庭始终在场；后记又把目光放回选择受限的故人身上。"}],"notes":["场景摘要是依据原书整理的短叙事；“这一刻之后”为编辑归纳，并非作者原话。","日期未明确时保留期间或相对时间。原书婚姻回忆存在年份冲突，以PDF第317页明确的1979年10月27日登记日期为主；第374页另写1980年，已记入场景出处。","1986年12月为博士完成时间（PDF380）；前言提到1987年的毕业聚会，两者分开理解。","坐标为城市或地域示意，连线表示叙事迁移，不代表精确交通路线。旧营房、砖窑等不确定地点不提供虚构坐标。","全书文字稿尚未逐字人工校勘。重要场景附原文短引文和PDF物理页，可继续回查扫描书。"],"map_source":{"name":"Natural Earth · 1:110m Land","url":"https://www.naturalearthdata.com/downloads/110m-physical-vectors/","license":"Public domain","data_url":"https://github.com/nvkelso/natural-earth-vector/blob/master/geojson/ne_110m_land.geojson"},"guide":{"version":2,"title":"一步一步，读懂单伟建","reviewed_at":"2026-09-22","steps":[{"id":"meet","part":"orientation","label":"先认识这个人","title":"单伟建是怎样走到这里的？","date":"从失学少年，到投资人与作者","place":"北京 → 戈壁 → 美国 → 香港","map":"pacific","route":["beijing","wulate","beijing","sanfrancisco","philadelphia","hongkong"],"stops":["beijing","wulate","sanfrancisco","philadelphia","hongkong"],"stage":null,"paragraphs":["理解单伟建，可以先记住四个身份：失学的少年、戈壁的劳动者、重新求学的学生与教授，以及后来进入金融业的投资人。每一次转换，都要面对不同的问题。","《走出戈壁》主要讲的是前三段经历，以及1993年转向投资银行工作的那个路口。它也在后记中写到2005年重返戈壁：已经走得很远的他，重新见到仍留在当地的故人。","我们先顺着这本书读他怎样获得学习、离开和选择的机会，再补读后来的投资与写作经历。一路留意两件事：他自己做了什么，又有哪些人和条件让改变成为可能。"],"takeaway":"先看人生中的处境如何改变，再看每次选择。","bridge":"要理解他为什么如此渴望读书，先回到那次突然中断的教育。","events":["early-books-from-fire","return-to-asia","return-old-neighbours"],"people":[],"photo":null,"source_ids":[],"source_note":""},{"id":"school","part":"book","label":"读书的愿望从哪里来","title":"学校停了，他仍然想读书","date":"1966年前后","place":"北京","map":"china","route":[],"stops":["beijing"],"stage":"childhood","paragraphs":["小时候的单伟建爱读科普书和小说，也喜欢动手。在少年科技馆，他从简单的矿石收音机学起，试着把元件焊接起来。听见自己做的收音机发声，学习给他的快乐非常具体。","小学毕业后，他准备参加升学考试，考试却被取消，入学也没有了确定的日子。大院里开始焚书，他趁人不注意把书捡回家。正规的学校教育中断了，阅读在偶然的缝隙中继续。","这段经历留下的不只是“爱读书”的习惯。多年后进入美国大学，他还要补上从少年时代起缺失的数学训练。教育中断的后果，远比停课的那几年长。"],"takeaway":"失学使“重新获得完整的教育”成为一个长期愿望。","bridge":"1969年，他离开北京。接下来的六年里，首先要解决的却是怎样活下去。","events":["early-radio-workshop","early-books-from-fire","early-family-hunger","early-village-question","berkeley-math"],"people":["parents"],"photo":"childhood","source_ids":[],"source_note":""},{"id":"gobi","part":"book","label":"先理解他的处境","title":"十五岁，到戈壁重新学会生活","date":"1969—1971年","place":"北京 → 乌拉特前旗、乌梁素海","map":"china","route":["beijing","wulate","wuliang"],"stops":["beijing","wulate","wuliang"],"stage":"survival","paragraphs":["1969年9月5日，十五岁的单伟建带着父母准备的行李离开北京。漫长的火车和卡车旅程后，迎接他的是荒漠中的草棚。宣传中的生活，与他真正面对的饥饿和寒冷相距很远。","在冰封的乌梁素海，他和刘小彤尝试改变打芦苇的分工，提高了效率。但分工不能解决所有问题：母亲寄来的手套、朋友借出的鞋帽，也关系到他能不能熬过严冬。","另一次劳动中，他与同伴连续挖渠三十一小时，完工后却得知渠段因地势问题被废弃。能吃苦，与劳动是否有用，原来是两回事。他开始想离开，同时仍不得不在这里生活。"],"takeaway":"这六年的起点，是生存与缺少选择；理解这一点，才能理解后来离开的分量。","bridge":"当离开暂时没有可能，他还能为自己做些什么？","events":["early-beijing-to-gobi","early-potatoes-letter-home","early-reed-division-of-labor","gobi-canal-31-hours","gobi-winter-borrowed-warmth"],"people":["li-baoquan","liu-xiaotong","li-rongtian","cui-xianchao"],"photo":"survival","source_ids":[],"source_note":""},{"id":"keep-learning","part":"book","label":"在困境里保留可能","title":"一盏灯、一本书，和身边的人","date":"1971—1973年","place":"戈壁的营房、工具棚与猪班","map":"china","route":[],"stops":["wulate","wuliang"],"stage":"possibility","paragraphs":["单伟建没有等到回学校才开始学习。他在工具棚里搭起桌凳，遮住煤油灯读书；从制砖劳动想到机器；读《赤脚医生手册》，又在于医生推荐下接受卫生员训练。知识开始与眼前能做的事相连。","被下放养猪的易空，是其中一位重要的老师。这位航空专家与他谈见闻、借阅书籍，也提醒他少凭意气行事。人仍在戈壁，想象中的世界却渐渐变大。","他也逐渐发现，与人相处是生活的一部分。遭遇批判后，他每天拿出时间串门，学习做排球裁判。读书、动手与结交朋友，并没有立刻带来出路，却让他在机会来临时多了一些准备。"],"takeaway":"他保留可能的方式很具体：持续学习，也向身边的人学习。","bridge":"有了准备和同伴的支持，是否就能离开？两次招生让他发现，事情远没有那么简单。","events":["gobi-barefoot-training","gobi-child-in-clinic","gobi-brick-machine","gobi-yi-kong","gobi-reading-and-making-friends"],"people":["yi-kong","doctor-yu","gao-xiaorong","li-rongtian"],"photo":"possibility","source_ids":[],"source_note":""},{"id":"leave-gobi","part":"book","label":"转折怎样真正发生","title":"得票第二，为什么仍然走不了？","date":"1974—1975年","place":"戈壁 → 北京","map":"china","route":["wulate","beijing"],"stops":["wulate","beijing"],"stage":"possibility","paragraphs":["1974年招生，他在推荐投票中得票第二，最终名单却没有他。此前，他与朋友曾写信反映兵团的问题；作者后来把这次落选与信件被转回兵团联系起来。群众支持、学校需要和组织批准，并不是同一件事。","次年，他再次得票第二，仍经历候补、体检和审批的反复。战友与于医生在不同环节相助，他自己的阅读和写作积累也终于派上用场：招生考试的一篇五页作文，让学校看到了他的准备。","1975年9月14日，正式批准终于传来。他当晚就走，火车开动后才放下心。离开时竟忘记带上朝夕相伴的铁锹。这次转折包含努力、他人的帮助和特定的机会，任何一项都不足以独自解释结果。"],"takeaway":"离开戈壁，是多年准备与有限机会终于相接的一刻。","bridge":"回到北京，他得到的不只是一个新地址，而是能稳定读书的生活。","events":["gobi-letter-on-horseback","gobi-1974-rejected","gobi-1975-alternate","gobi-exam-ready","gobi-leaving-same-day"],"people":["doctor-yu","li-rongtian","li-baoquan"],"photo":null,"source_ids":[],"source_note":""},{"id":"beijing","part":"book","label":"重新得到一间课堂","title":"回来了，还想把失去的教育补回来","date":"1975—1980年","place":"北京","map":"china","route":[],"stops":["beijing"],"stage":"classroom","paragraphs":["六年后回到北京，电灯、热水和足够的饭食已让他满足。在外贸学院，他重新练习英语听说，纠正自学时留下的问题。被送回兵团的噩梦却反复出现，过去没有随着离开立刻消失。","这一时期，他认识并与石滨结婚。石滨经历过唐山地震中的家庭丧失，两个人从贫困的条件中建立自己的家庭。此后的远行，也将不断牵动她的工作、照护和生活。","后来，联合国翻译工作的机会与赴美访问学习的机会同时出现。前者待遇优厚，还可以夫妻同行；他仍选择必须独自赴美的学习项目，因为想继续接受正规教育、获得学位。"],"takeaway":"当选择开始出现时，他首先想争取的是继续学习的机会。","bridge":"但到了美国，访问学者的身份，并不自动通向他想要的学位。","events":["return-to-beijing","marry-shibin","choose-study-over-un","tiananmen-1976"],"people":["shibin"],"photo":"classroom","source_ids":[],"source_note":""},{"id":"first-america","part":"book","label":"愿望遇到现实门槛","title":"想拿学位，学费从哪里来？","date":"1980—1982年","place":"旧金山","map":"pacific","route":["beijing","sanfrancisco"],"stops":["beijing","sanfrancisco"],"stage":"pacific","paragraphs":["1980年8月28日，单伟建第一次来到美国。到了旧金山大学，他才发现旁听课程不能获得学位。教授们帮他寻找合适的修课方案，但学费仍没有着落。他决定先继续学下去。","第一学期之后，一笔匿名捐款解决了学费。后来才知道，捐助者是卡苏夫妇。资助生活费结束后，卡洪夫妇又提供住处和工作机会，让他有条件完成课程。","他在1981年圣诞节前读完MBA课程，次年返京。这个学位是自己的学习成果，也包含许多人具体的付出。从这里看“个人奋斗”，就能看到它背后的人。"],"takeaway":"通往学位的路，既需要学习能力，也需要实际的资源和援手。","bridge":"拿到第一个研究生学位之后，他决定继续读博士。少年时代的教育缺口，又一次出现在面前。","events":["usf-degree-obstacle","anonymous-donor-mba"],"people":["casous","calhouns"],"photo":null,"source_ids":[],"source_note":""},{"id":"berkeley","part":"book","label":"怎样补上缺失的部分","title":"一本线性代数，读了七遍","date":"1982—1985年","place":"柏克莱","map":"usa","route":[],"stops":["berkeley"],"stage":"pacific","paragraphs":["1982年，带着全额奖学金，他到加州大学柏克莱分校读博士。录取并没有消除学业困难：小学以后长期缺少正规数学训练，使他在课程面前感到吃力。","他把线性代数课本读了七遍，也听取耶伦的建议，调整修课顺序。改变学习方法与投入时间，同样重要。耶伦又介绍他担任提斯的助教；在回答学生问题的过程中，他逐渐学会教学。","之后，他开始研究大型制药企业与生物技术初创企业的合作，走访公司、建立数据库。他不再只是追赶遗漏的课程，而是学习提出自己的问题、形成研究。"],"takeaway":"从补课到研究，关键变化是开始形成自己的问题与方法。","bridge":"课堂以外，还有一段同样重要、却容易在学历履历里消失的经历：一家人的分离与团聚。","events":["berkeley-math","teacher-researcher"],"people":["yellen","teece"],"photo":"pacific","source_ids":[],"source_note":""},{"id":"family","part":"book","label":"把家庭放回这段人生","title":"他在求学，石滨也在跨越障碍","date":"1983—1985年","place":"北京 ↔ 旧金山湾区","map":"pacific","route":["beijing","berkeley"],"stops":["beijing","berkeley"],"stage":"pacific","paragraphs":["1983年4月13日，儿子出生，单伟建在太平洋另一边得知消息。石滨在北京一面工作，一面照顾病母和婴儿。留学既是他的机会，也是两个人共同承担的分离。","1984年6月30日，石滨终于来到美国，孩子却仍留在北京。第二年暑假，她又为儿子的出国手续奔走。直到1985年八月底，一家三口才在湾区相聚。","学生公寓并不宽裕，但一家人终于能共同生活。之后从西海岸到华盛顿、再到费城与香港，每一次职业迁移都包含家庭的选择与安排。"],"takeaway":"理解他的远行，需要同时看见石滨的工作、照护和行动。","bridge":"学位即将完成，他终于可以在不同职业之间作选择。但自由选择并不意味着从此没有阻碍。","events":["family-reunion","phd-world-bank"],"people":["shibin","parents"],"photo":null,"source_ids":[],"source_note":""},{"id":"choose","part":"book","label":"从等待安排，到主动选择","title":"当选择变多，他为什么又离开？","date":"1986—1993年","place":"柏克莱 → 华盛顿 → 费城 → 香港","map":"pacific","route":["berkeley","washington","philadelphia","hongkong"],"stops":["berkeley","washington","philadelphia","hongkong"],"stage":"choices","paragraphs":["1986年12月完成博士后，他先到世界银行工作，随后接受沃顿商学院的教职。从等待审批才能离开戈壁，到在不同机构的聘请之间选择，这是一个显著的改变。","教授的生活仍有波折。1988年，全家因签证材料被错填而面临离境危机。同事、校友、律师与旧上司相助，问题才逐渐解决。即使已经走到这里，个人仍会受到制度与身份的限制。","任教六年后，研究已不能完全满足他。他希望参与正在发生的经济变化，1993年接受投资银行的工作，全家迁居香港。《走出戈壁》的正文就在这个新职业开始的地方收束。"],"takeaway":"他逐渐有了主动选择的空间，也开始把研究经济转向参与经济活动。","bridge":"进入投资经历之前，先把原书的最后一段读完：2005年，他回到了戈壁。","events":["phd-world-bank","wharton-choice","visa-crisis","return-to-asia"],"people":["shibin","teece"],"photo":"choices","source_ids":[],"source_note":""},{"id":"return","part":"book","label":"读到这里，再看“走出”的意义","title":"他走出去了，其他人呢？","date":"2005年7月","place":"香港 → 北京 → 内蒙古","map":"china","route":["hongkong","beijing","baotou","wulate","wuliang"],"stops":["hongkong","beijing","baotou","wuliang"],"stage":"return","paragraphs":["离开三十年后，单伟建利用一次工作调研重返戈壁。有些地方出现了新楼房与新的生活，旧营房和土地却已很难辨认。","李永芝仍一眼认出了他；她与王双喜留在当地养猪谋生。他又偶遇二狗，坐上对方的摩托车，去找当年打芦苇的驻地。共同经历过相似的青春，后来的人生却走向了不同的地方。","原书在这样的重逢中结束。回头看，读懂单伟建，不只是记住他后来得到了什么，也要记住他离开的处境、帮助过他的人，以及没有获得同样机会的故人。"],"takeaway":"个人经历的意义，也在与他人命运的对照之中。","bridge":"原书主线读到这里。接下来切换到书外资料，回到1993年的职业转向，继续了解投资人与作者这两个身份。","events":["return-old-neighbours","return-reed-ruins"],"people":["old-neighbours","ergou"],"photo":"return","source_ids":[],"source_note":""},{"id":"beyond-banker","part":"extension","date":"1993—1998；1998 年转入私募股权","place":"香港及亚洲","stage":null,"events":[],"people":[],"photo":null,"source_ids":["pag-bio"],"source_note":"任职年份依据 PAG 官方履历。不能据此推断他从 1993 年第一天就持有最终头衔，也不据此编造转职动机。","label":"书外续篇 · 身份的变化","title":"从解释经济，到参与商业决策","paragraphs":["先把时间拨回1993年。《走出戈壁》留下的职业路口，随后通向了投资银行和私募股权。PAG官方履历记载，单伟建于1993至1998年间在J.P. Morgan工作并兼任中国首席代表，1998年转入新桥资本。","这两类工作有所不同：投资银行可以帮助企业完成融资与交易；私募股权投资者则用资金持有企业股权，并可能参与治理。对读者而言，先分清角色，后面的银行收购故事就更容易理解。","回看前面的求学经历，我们可以提出一个问题：原先用于研究企业的知识，进入真实交易之后，要怎样面对不同参与者的利益与责任？这是接下来阅读的角度，而不是已被证明的个人成功公式。"],"takeaway":"先看他在交易中扮演什么角色，再看交易产生什么结果。","bridge":"其中一段重要经历发生在韩国。它可以帮助我们认识单伟建作为谈判参与者的一面。","route":["philadelphia","hongkong"],"stops":["philadelphia","hongkong"],"map":"pacific"},{"id":"beyond-korea","part":"extension","date":"1998—2005","place":"韩国·首尔","stage":null,"events":[],"people":[],"photo":null,"source_ids":["usc-talk","fsc-terms","sc-history","wiley-games"],"source_note":"区分协议达成与完成收购。大学介绍确认其主要参与角色；书中谈判过程属于当事人叙述，不能把机构转型归为一人之功。","label":"书外续篇 · 韩国第一银行","title":"一笔收购，为什么需要多年？","paragraphs":["亚洲金融危机之后，新桥参与收购韩国第一银行，单伟建在其中担任主要角色。监管记录显示，1998年先有备忘录，1999年签署投资条款；银行官方沿革把新桥完成收购记在2000年1月20日。","因此，阅读这段经历时，不能把宣布交易、谈成条件和真正接手混为一谈。2005年4月15日，渣打接手这家银行，构成这段机构历史的另一个节点。","单伟建后来在《Money Games》中讲述了谈判与重整的过程。这是重要的当事人视角；银行的变化还涉及政府、管理层、员工与其他参与者。可以带着“各方怎样建立合作”这个问题继续读，而不仅仅寻找某个人的秘诀。"],"takeaway":"交易是一个过程；看见各方的作用，才能理解谈判者的工作。","bridge":"随后把目光转向深圳：这次我们关注的，是收购完成以后怎样参与一家机构的变化。","route":[],"stops":["seoul"],"map":"china"},{"id":"beyond-shenzhen","part":"extension","date":"2004—2010","place":"中国·深圳","stage":null,"events":[],"people":[],"photo":null,"source_ids":["pingan-2009","pingan-2010","usc-talk","wiley-machine"],"source_note":"日期与持股身份来自交易当事机构公告；经营改善是多人和机构共同作用的结果。出版社宣传中的“唯一”“最成功”等说法不纳入正文。","label":"书外续篇 · 深圳发展银行","title":"收购之后，才是新的开始","paragraphs":["2004年，新桥成为深圳发展银行的战略投资者和最大股东，单伟建是这笔交易的重要参与者。2010年5月7日，新桥所持股份完成向中国平安的过户。这里的年份来自交易当事机构公告。","后来出版的《Money Machine》，是他对这段经历的回顾。它提供了参与者怎样理解交易与经营变化的视角；同期公告则能帮助我们确定发生了什么、何时发生。两种材料回答的问题不同，可以对照着读。","从人生经历看，这一阶段让“投资人”变得更具体：不仅要促成交易，还要面对收购之后的治理与组织问题。理解这些问题，需要把团队和制度一起放进画面。"],"takeaway":"把“完成一笔交易”与“让机构持续运作”分开看，才能看见后续责任。","bridge":"2010年起，他的角色再次变化：工作不再只围绕一笔交易，还围绕一个投资机构。","route":[],"stops":["shenzhen"],"map":"china"},{"id":"beyond-pag","part":"extension","date":"2010 年起","place":"香港及亚太地区","stage":null,"events":[],"people":[],"photo":null,"source_ids":["pag-bio"],"source_note":"不把 PAG 描述为单伟建一人从零创办，也不将 2010 年私募业务设立与 2011 年品牌重启混为一谈。最后半句为依据角色变化作出的编辑概括。","label":"书外续篇 · 组织与团队","title":"从做交易，到建设一个机构","paragraphs":["PAG官方历史记载，单伟建在2010年创立其私募股权业务。同年，这项业务与另外两项投资业务联合，次年以PAG品牌重新推出。这里包含既有团队与业务的汇合，并非一个人从零开始的故事。","截至2026年9月22日核查，PAG官网将他列为执行董事长和联合创始人。与单笔交易相比，这个角色让我们把目光移向组织：怎样与他人合作，怎样让经验成为团队可以延续的能力？","这也是阅读人物履历时值得停一下的地方。职务名称可以很短，但它无法独自说明工作的内容，更不能替代对其他共同建设者的认识。"],"takeaway":"一个人的经历进入机构之后，要和团队的历史一起理解。","bridge":"后来，他又选择用书来讲述过去。我们可以直接听听，他怎样理解自己的经历。","route":[],"stops":["hongkong"],"map":"china"},{"id":"beyond-author","part":"extension","date":"2019—2023","place":"面向中美及跨文化读者","stage":null,"events":[],"people":[],"photo":null,"source_ids":["wiley-gobi","wiley-games","wiley-machine","cuhk-2022","usc-talk"],"source_note":"出版日期按具体版次：Money Games 首版为 2020 年 10 月，2023 年有修订版；PAG 简历写 2021，可能混用版本，不以之覆盖出版社书目。Out of the Gobi 不同地区书目月份有差异，正文仅写 2019。本人价值观标为分享时的自述。","label":"书外续篇 · 回望与表达","title":"把人生写成书，也把问题留给读者","paragraphs":["2019年出版的《Out of the Gobi》讲述青春、求学与中美经历。《Money Games》首版出版于2020年，转向韩国第一银行；2023年的《Money Machine》则回顾深圳发展银行交易。这几本书提供了进入他不同身份的入口。","在香港中文大学2022年发布的分享记录中，他谈到运气、判断与持续学习。把这些话放回前面的故事里，会比单独摘一句格言更有意思：学习怎样发挥作用？他人的帮助和时代的机会，又出现在哪里？","回忆录也有讲述者自己的视角。读完他的解释之后，还可以对照同期公告与其他参与者的记录，继续问：哪些事实可以核实，哪些是他回望人生时赋予的意义？"],"takeaway":"既听当事人如何理解自己，也保留追问与对照其他资料的空间。","bridge":"最后，把这段人生收束为几个可以带回自己生活的问题。","route":[],"stops":["hongkong"],"map":"china"},{"id":"reflect","part":"reflection","label":"回看这一路","title":"读完以后，可以留下什么？","date":"从经历，回到问题","place":"北京、戈壁、美国与亚洲","stage":null,"map":"pacific","route":[],"stops":["beijing","wulate","sanfrancisco","hongkong"],"paragraphs":["第一，准备可以很具体。工具棚里的阅读、反复学习数学、调整修课顺序，都比“坚持就会成功”更值得细看：面对自己缺少的东西，还能改变什么方法？","第二，重要选择总有共同承担者。石滨在分离中的照护与奔走，卡苏夫妇的资助，战友和导师的帮助，都提醒我们去问：谁让一段个人经历成为可能，又是谁承担了它的代价？","第三，结果不能解释一切。招生里的阻力、职业中的身份限制，以及2005年仍留在戈壁的故人，让这段人生保留了不能被一句励志结论抹平的部分。","这些是从材料出发的阅读理解，不是作者给出的统一答案。若想继续发掘，可以回到最触动你的一个场景，读它前后的原文，再形成自己的判断。"],"takeaway":"看见行动，也看见关系、条件与未被讲完的人生。","bridge":"主线到这里结束。下面可以回读原书，或沿着一本著作、一次公开分享继续探索。","events":["gobi-reading-and-making-friends","berkeley-math","family-reunion","return-old-neighbours"],"people":[],"photo":null,"source_ids":[],"source_note":""}],"places":[{"id":"seoul","name":"首尔","lon":126.98,"lat":37.57,"precision":"城市级","note":"韩国第一银行总部城市；此处表示交易涉及的机构所在地，不推断作者某日行程。"},{"id":"shenzhen","name":"深圳","lon":114.06,"lat":22.55,"precision":"城市级","note":"深圳发展银行所在地；此处表示业务关联，不推断精确行程。"}],"sources":[{"id":"pag-bio","title":"About PAG — Weijian Shan / Our history","publisher":"PAG","url":"https://www.pag.com/en/about/","published_at":null,"accessed_at":"2026-09-22","supports":"1993—1998 J.P. Morgan；1998—2010 新桥/TPG；2010 创立 PAG 私募业务、三项业务联合；2011 品牌重新推出。","kind":"本人所在机构官方履历与机构历史"},{"id":"usc-talk","title":"Weijian Shan on his journey from the Gobi Desert to a becoming a successful financier","publisher":"USC US-China Institute","url":"https://china.usc.edu/weijian-shan-his-journey-gobi-desert-becoming-successful-financier","published_at":"2019-10-30","accessed_at":"2026-09-22","supports":"公开演讲与回忆录；介绍其领导韩国第一银行及深圳发展银行收购的角色。","kind":"大学举办的本人演讲介绍；人物简介仍可能使用主办方取得的本人履历"},{"id":"fsc-terms","title":"Terms of Investment Signed for the Sale of Korea First Bank","publisher":"Financial Services Commission, Korea","url":"https://www.fsc.go.kr/eng/pr010101/21640","published_at":"1999-09-17","accessed_at":"2026-09-22","supports":"1998-12-31 备忘录；1999-09-17 投资条款协议，尚待最终合同。","kind":"监管机构同期公告"},{"id":"sc-history","title":"Standard Chartered Korea — History","publisher":"Standard Chartered Korea","url":"https://www.standardchartered.co.kr/np/en/cms/cm/bi/EnHistory1.jsp","published_at":null,"accessed_at":"2026-09-22","supports":"2000-01-20 新桥收购；2005-04-15 渣打收购。","kind":"承继银行官方历史"},{"id":"pingan-2009","title":"Ping An to Become SDB’s Strategic Investor","publisher":"Ping An","url":"https://www.pingan.com/about/en/news_106532.jsp","published_at":"2009-06-22","accessed_at":"2026-09-22","supports":"2004 年新桥成为深发展战略投资者及最大股东；公告列有单伟建作为 TPG 合伙人的评论。","kind":"交易当事机构同期公告"},{"id":"pingan-2010","title":"深发展第一大股东平稳变更 平安集团完成受让新桥5.2亿股深发展股份","publisher":"平安银行（原深发展公告）","url":"https://bank.pingan.com/about/news/2012120197.shtml","published_at":"2010-05-10","event_date":"2010-05-07","accessed_at":"2026-09-22","supports":"正文记载 2010-05-07 完成新桥股份过户；网页发布时间 05-10。","kind":"交易完成公告"},{"id":"wiley-gobi","title":"Out of the Gobi: My Story of China and America","publisher":"Wiley-VCH / John Wiley & Sons","url":"https://www.wiley-vch.de/de?isbn=9781119529491&option=com_eshop&title=Out+of+the+Gobi&view=product","published_at":"2019","accessed_at":"2026-09-22","supports":"2019 出版、书名与回忆录主题。","kind":"出版社书目"},{"id":"wiley-games","title":"Money Games: The Inside Story of How American Dealmakers Saved Korea's Most Iconic Bank","publisher":"Wiley","url":"https://uat.store.wiley.com/en-us/money-games-the-inside-story-of-how-american-dealmakers-saved-korea%27s-most-iconic-bank-p-9781119736981","published_at":"2020-10","accessed_at":"2026-09-22","supports":"ISBN 9781119736981，首版 2020-10；书由交易当事人单伟建叙述新桥收购和重整韩国第一银行。","kind":"出版社书目；可访问的官方 UAT 商店镜像，主站产品 URL 抓取 403"},{"id":"wiley-machine","title":"Money Machine: A Trailblazing American Venture in China","publisher":"Wiley-VCH / John Wiley & Sons","url":"https://www.wiley-vch.de/en/areas-interest/finance-economics-law/finance-investments-13fi/institutional-corporate-finance-13fi1/money-machine-978-1-394-16120-1","published_at":"2023-02","accessed_at":"2026-09-22","supports":"首版 2023-02；本人记述新桥收购及重整深圳发展银行的经历。","kind":"出版社书目"},{"id":"cuhk-2022","title":"Up Close and Personal with the Private Equity Legend Dr. Weijian Shan","publisher":"CUHK Business School","url":"https://www.bschool.cuhk.edu.hk/school-news/up-close-and-personal-with-the-private-equity-legend-dr-weijian-shan/","published_at":"2022-01-10","event_date":"2022-01-03","accessed_at":"2026-09-22","supports":"在 Money Games 中文版活动中，本人谈到 luck and good judgement、live to learn and experience；仅转述观点，不采信宣传性赞誉。","kind":"大学发布的本人分享记录"}],"reading_links":[{"label":"听他讲述：从戈壁到美国（USC 演讲）","url":"https://china.usc.edu/weijian-shan-his-journey-gobi-desert-becoming-successful-financier","why":"大学公开活动，适合将页面中的概括与本人的讲述相互对照。"},{"label":"读下一本：Money Games","url":"https://uat.store.wiley.com/en-us/money-games-the-inside-story-of-how-american-dealmakers-saved-korea%27s-most-iconic-bank-p-9781119736981","why":"想继续了解韩国交易，可读当事人自己的完整叙述。"},{"label":"再往后：Money Machine","url":"https://www.wiley-vch.de/en/areas-interest/finance-economics-law/finance-investments-13fi/institutional-corporate-finance-13fi1/money-machine-978-1-394-16120-1","why":"想深入深圳发展银行经历，可读此书；应与同期机构资料对照。"}],"images":[{"id":"shan-author-portrait","file":"shan-portrait.jpg","alt":"单伟建","caption":"单伟建。图片来源：作者官网。","source_url":"https://weijian-shan.com/biographyofweijianshan/","image_url":"https://weijian-shan.com/wp-content/uploads/2023/02/weijian-shan-1.jpg","credit":"页面未见摄影师署名；页脚为 © Copyright WEIJIAN SHAN 2018–2023。","license":"未发现明确的开放许可或转载授权；不能声称 CC、免版权或取得许可。","notes":"图片实际拍摄时间未注明，不要根据上传路径把它写成摄于 2023 年。"},{"id":"money-games-cover","file":"money-games.jpg","alt":"Money Games 官方立体书封面图","caption":"《Money Games》书封。图片来源：作者官网；出版：Wiley。","source_url":"https://weijian-shan.com/books/","image_url":"https://weijian-shan.com/wp-content/uploads/2023/03/money-games-3d.jpg","credit":"图片旁未见封面设计者或摄影者署名。作者网站页脚有版权声明。","license":"未发现明确的开放许可或转载授权；只可表述为官方书封来源。","notes":"上传于 2023 年的文件可能对应修订版。主线出版年仍应说明 2020 首版，不可仅凭封面文件时间改年。"},{"id":"money-machine-cover","file":"money-machine.jpg","alt":"Money Machine 官方立体书封面图","caption":"《Money Machine》书封。图片来源：作者官网；出版：Wiley。","source_url":"https://weijian-shan.com/books/","image_url":"https://weijian-shan.com/wp-content/uploads/2023/03/money-machine-3d.jpg","credit":"图片旁未见封面设计者或摄影者署名。作者网站页脚有版权声明。","license":"未发现明确的开放许可或转载授权；不能声称免版权。","notes":"官网把此 img 的 alt 错填为 Money Games。以对应 MONEY MACHINE 部分、实际 filename 和下载后画面文字核对，不复制这个错误 alt。"}]},"chapters":[{"id": <script>'use strict';
const story = JSON.parse(document.getElementById('story-data').textContent);
const land = JSON.parse(document.getElementById('land-data').textContent);
const guide = story.guide;
const indexById = items => Object.fromEntries(items.map(x=>[x.id,x]));
const stages=indexById(story.stages), events=indexById(story.events), people=indexById(story.people);
const places=indexById([...story.places,...guide.places]), threads=indexById(story.threads);
const sources=indexById(guide.sources), images=indexById(guide.images||[]);
const $=selector=>document.querySelector(selector);
const E=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reading=$('#reading');
const parts={orientation:'认识人物',book:'原书主线',extension:'书外续篇',reflection:'回看与继续探索'};
const bookmarkKey='gobi-guided-reading-v2';
let current=0,mapView='pacific',mapContext=null;
function narrativeHTML(step) {
  const names={'shibin':'石滨','liu-xiaotong':'刘小彤','li-rongtian':'李荣田','cui-xianchao':'崔贤超','doctor-yu':'于医生','yi-kong':'易空','yellen':'耶伦','teece':'提斯','casous':'卡苏夫妇','calhouns':'卡洪夫妇','ergou':'二狗'};
  const linked=new Set();
  return step.paragraphs.map(paragraph=>{
    let html=E(paragraph);
    for(const id of step.people){const name=names[id];if(name&&!linked.has(id)&&linked.size<2&&html.includes(name)){html=html.replace(name,`<button class="inline-person" data-person="${id}" aria-label="了解${name}在这段人生中的作用">${name}</button>`);linked.add(id);}}
    return `<p>${html}</p>`;
  }).join('');
}
function bookFeature(kind) {
  const games=kind==='games', image=images[games?'money-games-cover':'money-machine-cover'];
  if(!image)return '';
  const source=sources[games?'wiley-games':'wiley-machine'];
  return `<section class="book-feature"><img src="assets/${image.file}" alt="${E(image.alt)}" loading="lazy"><div><h2>${games?'Money Games':'Money Machine'}</h2><p>${games?'从谈判与重整的当事人视角，继续了解韩国第一银行。':'从当事人的回顾，继续了解深圳发展银行的交易与治理。'}</p><a href="${E(source.url)}" target="_blank" rel="noopener">出版社介绍 ↗</a><small>${games?'2020年首版；图为作者官网所示含追加内容封面。':'2023年出版。'} <a href="${E(image.source_url)}" target="_blank" rel="noopener">图片来源：作者官网</a></small></div></section>`;
}
function externalSources(step) {
  return `<ol class="evidence-list">${step.source_ids.map(id=>{const s=sources[id];return `<li><a href="${E(s.url)}" target="_blank" rel="noopener">${E(s.title)} ↗</a><p>${E(s.publisher)} · ${E(s.published_at||'未标发布日期')} · ${E(s.kind)}</p><p>依据：${E(s.supports)}</p></li>`;}).join('')}</ol>${step.source_note?`<p class="detail-note">${E(step.source_note)}</p>`:''}<p class="detail-note">资料核查：${E(guide.reviewed_at)}。正文的事实依据见上；理解问题与收束语为编辑整理。</p>`;
}
function supplementary(step) {
  return `<details class="further"><summary>${step.part==='extension'?'想继续发掘：资料来源与阅读线索':'想多了解一点：人物、原书照片与场景依据'}</summary><div class="supplement">${step.people.length?`<h3>这一段里的人</h3><div class="person-chips">${step.people.map(id=>`<button class="chip" data-person="${id}">${E(people[id].name)} ↗</button>`).join('')}</div>`:''}${step.events.length?`<h3>展开具体场景</h3>${relatedList(step.events)}<details class="source"><summary>查原书短引文与扫描页</summary>${step.events.map(id=>sourceLinks(events[id])).join('')}</details>`:''}${step.source_ids.length?externalSources(step):''}<div class="quiet-actions"><button data-map>在地图上看这一段</button>${step.photo?`<button data-photo="${step.photo}">查看原书整页照片</button>`:''}<button data-people>所有同行人物</button></div></div></details>`;
}
function renderReading() {
  const step=guide.steps[current];
  $('#part-label').textContent=parts[step.part];
  $('#position-label').textContent=`${current+1} / ${guide.steps.length}`;
  $('#progress').setAttribute('aria-valuemax',guide.steps.length);
  $('#progress').setAttribute('aria-valuenow',current+1);
  $('#progress').setAttribute('aria-valuetext',`${parts[step.part]}，第${current+1}步：${step.title}`);
  $('#progress-fill').style.width=`${(current+1)/guide.steps.length*100}%`;
  const portrait=images['shan-author-portrait'];
  const portraitHTML=step.id==='meet'&&portrait?`<figure class="portrait"><img src="assets/${portrait.file}" alt="单伟建肖像"><figcaption>单伟建<br><a href="${E(portrait.source_url)}" target="_blank" rel="noopener">图片来源：作者官网</a></figcaption></figure>`:'';
  let photoHTML='';
  if(['gobi','beijing','berkeley','return'].includes(step.id)){
    const stage=stages[step.photo];
    photoHTML=`<figure class="episode-photo"><button data-photo="${stage.id}" aria-label="放大这一段的原书照片"><img src="assets/page-${String(stage.photo).padStart(3,'0')}.jpg" alt="${E(stage.photo_caption)}" loading="lazy"></button><figcaption><strong>从原书照片看这段人生</strong>${E(stage.photo_caption)}<span class="image-hint">点击照片，放大看原页</span></figcaption></figure>`;
  }
  const boundary=step.id==='beyond-banker'?'<aside class="boundary">从这里进入书外续篇。时间回到1993年，后续内容依据机构公告、出版社资料与公开分享整理。</aside>':'';
  const bookHTML=step.id==='beyond-korea'?bookFeature('games'):step.id==='beyond-shenzhen'?bookFeature('machine'):step.id==='beyond-author'?`<div class="bookshelf">${bookFeature('games')}${bookFeature('machine')}</div>`:'';
  const finish=step.id==='reflect'?`<section class="further-reading"><h2>接下来，沿着感兴趣的一段继续读</h2><a href="../../book_reader/site/dist/index.html" target="_blank" rel="noopener">回到《走出戈壁》全书 ↗</a>${guide.reading_links.map(link=>`<a href="${E(link.url)}" target="_blank" rel="noopener">${E(link.label)} ↗</a>`).join('')}</section>`:'';
  reading.innerHTML=`<header class="step-heading"><span class="eyebrow">${E(step.label)}</span><h1 id="step-title" tabindex="-1">${E(step.title)}</h1><div class="where"><span>${E(step.date)}</span><span>${E(step.place)}</span><button data-map>看地图 ↗</button></div></header>${boundary}${step.id==='meet'?'<p class="path-note">先读书中的人生，再走进书外续篇。每一步只往前走一小段。</p>':''}<div class="narrative">${portraitHTML}${narrativeHTML(step)}</div>${photoHTML}${bookHTML}<aside class="takeaway"><h2>读到这里，可以这样理解</h2><p>${E(step.takeaway)}</p></aside><p class="bridge">${E(step.bridge)}</p>${finish}${supplementary(step)}`;
  $('#previous').disabled=current===0;
  const next=guide.steps[current+1];
  $('#next').innerHTML=next?`<span><small>${next.part!==step.part?'接下来 · '+parts[next.part]:'继续读'}</small><strong>${E(next.title)}</strong></span><span class="arrow" aria-hidden="true">→</span>`:'<span><small>沿着自己的兴趣继续</small><strong>回到阅读目录</strong></span><span class="arrow" aria-hidden="true">↗</span>';
}
function resolveStep(id) {
  const value=String(id||'').replace(/^read\//,'');
  let index=guide.steps.findIndex(s=>s.id===value);
  if(index<0&&stages[value])index=guide.steps.findIndex(s=>s.stage===value&&s.part==='book');
  return index;
}
function navigateStep(value,{focus=true,persist=true,updateURL=true}={}) {
  const index=typeof value==='number'?value:resolveStep(value);
  current=Math.max(0,Math.min(guide.steps.length-1,index<0?0:index));
  renderReading();
  if(updateURL)history.replaceState(null,'',`#read/${guide.steps[current].id}`);
  if(persist){try{localStorage.setItem(bookmarkKey,guide.steps[current].id);}catch{/* Reading still works when browser storage is unavailable. */}}
  if(focus){$('#step-title').focus({preventScroll:true});$('.layout').scrollIntoView({behavior:'instant',block:'start'});}
}
function selectStage(id) {navigateStep(id||'meet');}
function advance(direction) {
  if(direction>0&&current===guide.steps.length-1){launchDetail('menu');return;}
  navigateStep(current+direction);
}
function menuHTML() {
  return `<h2 id="detail-title">这一路，怎样往下读</h2><p class="detail-note">你现在在第${current+1}步。可以从这里选一段；关闭目录，就回到刚才的正文。</p>${Object.entries(parts).map(([key,label])=>`<section class="toc-group"><h3>${label}${key==='book'?' · 以《走出戈壁》为依据':key==='extension'?' · 公开资料补读':''}</h3>${guide.steps.map((s,i)=>s.part===key?`<button class="toc-row" data-step="${s.id}" ${i===current?'aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span><span>${E(s.title)}<small>${E(s.date)}</small></span></button>`:'').join('')}</section>`).join('')}<details class="further"><summary>还想自由探索</summary><div class="quiet-actions"><button data-people>所有同行人物</button>${story.threads.map(t=>`<button data-thread="${t.id}">沿着「${E(t.name)}」重读</button>`).join('')}<button data-about>资料与图片出处</button></div></details>`;
}
function mapHTML() {
  mapContext=guide.steps[current];mapView=mapContext.map;
  return `<h2 id="detail-title">这一段，发生在哪里？</h2><p class="detail-note">${E(mapContext.place)}</p><div class="map-heading"><h3 id="map-title"></h3><div class="map-switch" aria-label="地图范围"><button data-view="pacific">全程</button><button data-view="china">东亚</button><button data-view="usa">美国</button></div></div><div class="map-canvas"><svg id="map" viewBox="0 0 960 590" role="img" aria-labelledby="map-a11y-title map-a11y-desc"></svg></div><div id="place-list" class="place-list"></div><p class="detail-note">${mapContext.part==='extension'?'书外地图标注相关机构所在城市；不代表作者在特定日期的行程。':'地点为城市或地域示意；连线表示叙事迁移，不是精确交通路线。'}</p>`;
}

function renderMap() {
  const stage = mapContext;
  const settings = {
    pacific:{extent:[75,305,5,76],title:'跨越太平洋的旅程'},
    china:{extent:[95,133,16,50],title:'东亚的相关地点'},
    usa:{extent:[225,298,23,51],title:'在美国，从求学到任教'}
  }[mapView];
  $('#map-title').textContent = settings.title;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===mapView)));
  const [minX,maxX,minY,maxY] = settings.extent;
  const scale = Math.min(830/(maxX-minX),430/((maxY-minY)*1.28));
  const project = (lon,lat) => [480+(lon-(minX+maxX)/2)*scale,285-(lat-(minY+maxY)/2)*scale*1.28];
  const point = id => {const p=places[id];return project(p.lon<0?p.lon+360:p.lon,p.lat);};
  const fmt = n=>n.toFixed(2);
  let paths='';
  for (const feature of land.features) {
    const polygons = feature.geometry.type==='Polygon'?[feature.geometry.coordinates]:feature.geometry.coordinates;
    for (const shift of [0,360]) for (const polygon of polygons) {
      const path = polygon.map(ring=>ring.map((coord,i)=>{const [x,y]=project(coord[0]+shift,coord[1]);return `${i?'L':'M'}${fmt(x)},${fmt(y)}`;}).join('')+'Z').join('');
      paths+=`<path class="land" d="${path}"/>`;
    }
  }
  let grid='';
  for(let lon=0;lon<=360;lon+=20){const [x]=project(lon,0);grid+=`<path class="graticule" d="M${fmt(x)},0V590"/>`;}
  for(let lat=0;lat<90;lat+=15){const [,y]=project(0,lat);grid+=`<path class="graticule" d="M0,${fmt(y)}H960"/>`;}
  const route = stage?stage.route:['beijing','wulate','beijing','sanfrancisco','philadelphia','hongkong','wuliang'];
  let routePaths='';
  for(let i=1;i<route.length;i++){
    const [ax,ay]=point(route[i-1]),[bx,by]=point(route[i]);
    const bend=Math.min(100,Math.hypot(bx-ax,by-ay)*.22);
    routePaths+=`<path class="route" d="M${fmt(ax)},${fmt(ay)} Q${fmt((ax+bx)/2)},${fmt((ay+by)/2-bend)} ${fmt(bx)},${fmt(by)}" marker-end="url(#arrow)"/>`;
  }
  const stopIds=stage?stage.stops:story.overview.stops;
  const seen=new Set();
  const offsets={beijing:[13,30],shandong:[16,20],wulate:[-14,-22],wuliang:[-14,-22],sanfrancisco:[-15,33],berkeley:[-15,33],washington:[-12,40],philadelphia:[14,-18],hongkong:[14,30],baotou:[-13,35]};
  let labels='';
  for(const id of stopIds){
    const key=['wulate','wuliang','baotou'].includes(id)?'gobi':['sanfrancisco','berkeley'].includes(id)?'bay':id;
    if(seen.has(key))continue;
    seen.add(key);
    const [x,y]=point(id);
    if(x<20||x>940||y<20||y>565)continue;
    let [dx,dy]=offsets[id]||[14,-16];
    if(key==='gobi' && mapView==='pacific'){dx=14;dy=-25;}
    if(key==='bay' && mapView==='usa'){dx=14;dy=33;}
    const name=key==='gobi'?'戈壁 · 乌梁素海':key==='bay'?'旧金山湾区':places[id].name;
    labels+=`<a href="#place-${id}" data-map-place="${id}" aria-label="探索${E(name)}"><circle class="map-dot" cx="${fmt(x)}" cy="${fmt(y)}" r="6"/><text class="map-label" x="${fmt(x+dx)}" y="${fmt(y+dy)}" text-anchor="${dx<0?'end':'start'}">${E(name)}</text></a>`;
  }
  const ocean=mapView==='pacific'?'<text class="map-region" x="480" y="460" text-anchor="middle">PACIFIC OCEAN</text>':'';
  $('#map').innerHTML=`<title id="map-a11y-title">${E(settings.title)}</title><desc id="map-a11y-desc">${E(stopIds.map(id=>places[id].name).join('、'))}。地点入口在地图下方；连线仅表示迁移联系。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a36119"/></marker></defs>${grid}${paths}${ocean}${routePaths}${labels}`;
  $('#place-list').innerHTML=stopIds.map(id=>`<button data-place="${id}">${E(places[id].name)} ↗</button>`).join('');
}

const dialog = $('#detail'), detailBody = $('#detail-body');
let dialogHistory=[];
function sourceLinks(event) {
  const chapter=story.chapters.find(c=>c.id===event.chapter_id);
  const supporting=story.chapters.filter((c,i)=>event.pdf_pages.some(p=>p>=c.start && p<(story.chapters[i+1]?.start??421)));
  return `<details class="source"><summary>查看原书依据 · ${E(chapter?.title||'原书')} · PDF ${event.pdf_pages.join('、')} 页</summary><blockquote>「${E(event.quote.text)}」</blockquote><p>原书短引文 · PDF物理第${event.quote.pdf_page}页。以上叙事为编辑整理，以下可回查文字及扫描原页。</p><div class="source-links">${supporting.map(c=>`<a href="../../book_reader/site/dist/index.html#${c.section}" target="_blank" rel="noopener">${E(c.title)} ↗</a>`).join('')}${event.pdf_pages.map(p=>`<a href="../../走出戈壁-单伟健.pdf#page=${p}" target="_blank" rel="noopener">扫描第${p}页 ↗</a>`).join('')}</div>${event.notes.length?`<ul class="source-notes">${event.notes.map(n=>`<li>${E(n)}</li>`).join('')}</ul>`:''}</details>`;
}
function relatedList(ids) {
  return `<div class="related-list">${ids.map(id=>{const event=events[id];return `<button class="related-link" data-event="${id}"><span>第${stages[event.stage].number}幕 · ${E(event.date_label)}</span>${E(event.title)} ↗</button>`;}).join('')}</div>`;
}
function openDetail(kind,id,{back=false}={}) {
  if(!back)dialogHistory.push({kind,id});
  const backButton=dialogHistory.length>1?'<button class="inline-back" data-detail-back>← 返回刚才的阅读</button>':'';
  let html='';
  if(kind==='menu'){html=menuHTML();}
  else if(kind==='map'){html=mapHTML();}
  else if(kind==='event'){
    const event=events[id],stage=stages[event.stage];

    html=`<div class="stage-kicker">第${stage.number}幕 · ${E(event.date_label)}</div><h2 id="detail-title">${E(event.title)}</h2><p class="eyebrow">${E(event.place)}</p><p class="narrative">${E(event.summary)}</p><section class="detail-section"><h3>当时的处境</h3><p>${E(event.stakes)}</p></section><section class="detail-section"><h3>他怎样回应</h3><p>${E(event.action)}</p></section><section class="detail-section"><h3>这一刻之后</h3><p>${E(event.change)}</p></section>${event.people.length?`<section class="detail-section"><h3>在这件事里，人们做了什么</h3>${event.people.map(p=>`<p><strong>${E(p.name)}</strong> · ${E(p.role)}</p>`).join('')}${event.person_ids.length?`<div class="person-chips">${event.person_ids.map(pid=>`<button class="chip" data-person="${pid}">${E(people[pid].name)} ↗</button>`).join('')}</div>`:''}</section>`:''}${sourceLinks(event)}<section class="detail-section"><h3>带着这个场景继续读</h3><div class="person-chips">${event.tags.map(t=>`<button class="chip" data-thread="${t}">沿着「${E(threads[t].name)}」↗</button>`).join('')}<button class="chip" data-go-stage="${event.stage}">在主线读这一段 →</button></div></section>`;
  } else if(kind==='person'){
    const person=people[id];
    html=`<div class="stage-kicker">同行的人 / ${E(person.role)}</div><h2 id="detail-title">${E(person.name)}</h2><p class="narrative">${E(person.bio)}</p><section class="detail-section"><h3>从具体的相遇理解这段关系</h3>${relatedList(person.events)}</section>`;
  } else if(kind==='thread'){
    const thread=threads[id];
    const ids=story.stages.flatMap(s=>s.scenes).filter(eid=>events[eid].tags.includes(id));
    html=`<div class="stage-kicker">一条贯穿人生的线索</div><h2 id="detail-title">${E(thread.name)}：${E(thread.subtitle)}</h2><p class="narrative">${E(thread.intro)}</p><p class="detail-note">以下场景按七幕顺序排列，表现主题的呼应；不把时间先后直接视为因果。</p>${relatedList(ids)}`;
  } else if(kind==='place'){
    const place=places[id];
    let ids=[id],title=place.name;
    if(['wuliang','wulate','baotou'].includes(id)){ids=['wuliang','wulate','baotou'];title='戈壁 · 乌拉特前旗与乌梁素海';}
    if(['sanfrancisco','berkeley'].includes(id)){ids=['sanfrancisco','berkeley'];title='旧金山湾区 · 两次求学';}
    const related=story.stages.flatMap(s=>s.scenes).filter(eid=>ids.includes(events[eid].map_place));
    const passing=story.stages.filter(s=>s.stops.some(pid=>ids.includes(pid)));
    html=`<div class="stage-kicker">地点 / ${E(place.precision)}</div><h2 id="detail-title">${E(title)}</h2><p class="narrative">${E(place.note)}</p><p class="detail-note">地点按城市或地域组织。每个场景正文保留更具体的地点说明；地图点位不代表旧址的精确位置。</p><div class="person-chips">${passing.map(s=>`<button class="chip" data-go-stage="${s.id}">第${s.number}幕 · ${E(s.title)}</button>`).join('')}</div>${guide.steps.filter(s=>s.part==='extension'&&s.stops.some(p=>ids.includes(p))).map(s=>`<button class="related-link" data-step="${s.id}"><span>书外续篇 · ${E(s.date)}</span>${E(s.title)} ↗</button>`).join('')}${related.length?relatedList(related):''}`;
  } else if(kind==='people'){
    html=`<div class="stage-kicker">同行的人</div><h2 id="detail-title">改变人生的，<br>也有一次具体的相助</h2><p class="narrative">从家人、戈壁的同伴，到大学里的师友。选择一个人，回到他们相遇、相助或共同选择的场景。</p><div class="person-directory">${story.people.map(p=>`<button class="related-link" data-person="${p.id}"><span>${E(p.role)}</span><strong>${E(p.name)} ↗</strong></button>`).join('')}</div>`;
  } else if(kind==='photo'){
    const stage=stages[id];
    html=`<h2 id="detail-title">原书照片 · PDF第${stage.photo}页</h2><img class="photo-large" src="assets/page-${String(stage.photo).padStart(3,'0')}.jpg" alt="${E(stage.photo_caption)}"><p class="detail-note">${E(stage.photo_caption)}</p><a href="assets/page-${String(stage.photo).padStart(3,'0')}.jpg" target="_blank" rel="noopener">打开原图继续放大 ↗</a>`;
  } else {
    html=`<div class="stage-kicker">资料与编排</div><h2 id="detail-title">从人生轨迹，回到原书</h2><p class="narrative">这张地图以《走出戈壁》的全书文字稿为主要依据，保留34个有原书依据的场景，并编排为一条逐步带读的主线。书外续篇另以公开来源补充投资与写作经历。</p><p class="detail-note">主线先读原书，再读书外续篇。原书结束于2005年重访，续篇明确回到1993年的职业转向。人物、地图和主题是按需展开的补充阅读，关闭后仍回到当前步骤。阅读位置只保存在本机浏览器中。</p><ul class="about-list">${story.notes.map(n=>`<li>${E(n)}</li>`).join('')}</ul><section class="detail-section"><h3>资料、地图与影像</h3><p>书外续篇的每一步都有公开资料链接。事实叙述与“读到这里，可以这样理解”的编辑归纳分开呈现。</p><p>海陆轮廓采用 <a href="${story.map_source.url}" target="_blank" rel="noopener">Natural Earth 1:110m Land</a> 公共领域数据。地图不表达行政边界。</p><p>历史照片为原书扫描页，保留原图注；肖像与两本著作封面来自作者官网，各图附来源。书封所示版本与正文首版出版年分别说明。</p><p>页面和照片可以离线阅读。全书与扫描页链接需要保留当前项目的目录结构。</p></section><div class="source-links"><a href="../../book_reader/site/dist/index.html" target="_blank" rel="noopener">进入全书阅读器 ↗</a><a href="../../走出戈壁-单伟健.pdf" target="_blank" rel="noopener">打开原书PDF ↗</a></div>`;
  }
  detailBody.innerHTML=backButton+html;
  if(kind==='map')renderMap();
  if(!dialog.open)dialog.showModal();
  dialog.scrollTop=0;
  $('#detail-title').setAttribute('tabindex','-1');
  $('#detail-title').focus({preventScroll:true});
}

let opener=null;
function launchDetail(kind,id){if(!dialog.open){dialogHistory=[];opener=document.activeElement;}openDetail(kind,id);}
function closeDetail(){dialog.close();dialogHistory=[];}
$('#close-detail').addEventListener('click',closeDetail);
dialog.addEventListener('close',()=>{dialogHistory=[];if(opener?.isConnected)opener.focus({preventScroll:true});});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDetail();}});
$('#previous').addEventListener('click',()=>advance(-1));
$('#next').addEventListener('click',()=>advance(1));
document.addEventListener('click',e=>{
  const link=e.target.closest('[data-map-place]');
  if(link){e.preventDefault();launchDetail('place',link.dataset.mapPlace);return;}
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-home'))navigateStep('meet');
  else if(b.hasAttribute('data-menu'))launchDetail('menu');
  else if(b.hasAttribute('data-map'))launchDetail('map');
  else if(b.dataset.step){closeDetail();navigateStep(b.dataset.step);}
  else if(b.dataset.view){mapView=b.dataset.view;renderMap();}
  else if(b.dataset.event)launchDetail('event',b.dataset.event);
  else if(b.dataset.person)launchDetail('person',b.dataset.person);
  else if(b.dataset.thread)launchDetail('thread',b.dataset.thread);
  else if(b.dataset.place)launchDetail('place',b.dataset.place);
  else if(b.dataset.photo)launchDetail('photo',b.dataset.photo);
  else if(b.hasAttribute('data-people'))launchDetail('people');
  else if(b.hasAttribute('data-about'))launchDetail('about');
  else if(b.dataset.goStage){closeDetail();selectStage(b.dataset.goStage);}
  else if(b.hasAttribute('data-detail-back')){dialogHistory.pop();const previous=dialogHistory[dialogHistory.length-1];if(previous)openDetail(previous.kind,previous.id,{back:true});}
});
function restoreReading() {
  let index=resolveStep(location.hash.slice(1));
  if(index<0&&!location.hash){try{index=resolveStep(localStorage.getItem(bookmarkKey));}catch{/* First-time/offline reading remains available. */}}
  navigateStep(index<0?0:index,{focus:false,persist:false});
}
window.addEventListener('hashchange',()=>{if(dialog.open)closeDetail();navigateStep(location.hash.slice(1),{focus:true,updateURL:false});});
restoreReading();
</script>
</body></html>
